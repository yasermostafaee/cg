<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      B-136 — `media-src` IS LOAD-BEARING FOR PVW, and its absence is why PVW never
      showed a video. This page EMBEDS an exported single-file template in an
      `<iframe srcDoc>` (`RehearsalFrame.tsx:236`), and a `srcdoc` document INHERITS
      its embedder's CSP — enforced IN ADDITION to the artifact's own, intersection
      wins. The artifact has declared `media-src data:` since D-128 Phase 5, but this
      page declared no `media-src` at all, so media fell through to
      `default-src 'self'` and every base64 `data:video/webm` was refused. Images and
      fonts survived the intersection because they ARE listed — media was the only
      class omitted, which is exactly why only video was invisible.

      `data:` is what the exporter inlines; `'self'` covers same-origin media. NO
      `blob:` — unlike the Designer (which plays video off object URLs) nothing in
      this app creates one, so admitting it would widen the policy past the need.
      ⚠ PARITY WITH THE DESIGNER IS NOT A REASON TO ADD IT (owner's call, 2026-08-12):
      two apps are allowed to have different policies because they have different
      needs. If a future change genuinely needs `blob:` here, that change adds it —
      with a test that proves the need.
      Pinned by `tests/e2e/pvw-video.spec.ts` in a REAL browser: jsdom does not
      enforce CSP, so no unit test can observe this.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; media-src 'self' data:; connect-src 'self' ws: wss: http: https:; base-uri 'none'"
    />
    <!--
      R-035 — LOADED NON-BLOCKING (`media="print"` until `onload`), and that is not a
      micro-optimisation: a plain `<link rel="stylesheet">` to a CDN blocks the FIRST
      PAINT until the CDN answers or the socket times out. The splash below exists to own
      the first frame, and on a LAN-only broadcast machine — which is most of them —
      jsdelivr never answers, so the render-blocking form would hand the operator a blank
      screen for the whole TCP timeout. Nothing about WHICH faces load changes: the sheet
      still applies the moment it arrives.

      The face itself is a leftover: the Designer self-hosts its fonts and this app already
      ships the same Vazirmatn faces in `src/renderer/fonts.css` — but that file is imported
      only as `?inline` for template delivery, so the app UI still reads Persian off this
      CDN. Moving it to the self-hosted faces is filed as item 4 in
      `openspec/changes/runtime-splash-screen/DEBT.md`, not done here.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5/index.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <title>cg Runtime</title>

    <!--
      ══ R-035 · STARTUP SPLASH — CRITICAL CSS ═════════════════════════════════════

      Inline, in `<head>`, because this must paint on the FIRST FRAME: no bundle, no
      stylesheet request, no webfont. (A React splash cannot exist during the window it is
      for — the bundle has to parse and `createRuntimeBridge()` has to resolve its probe
      first, which is precisely the window being covered.)

      COLOUR RULE — NO RED ANYWHERE ON THIS SCREEN. Red is the SACRED air-state colour in
      this app and decorative red is forbidden across the UI (`src/renderer/theme.ts`); a
      boot screen is the last place it may appear, because it would teach the operator's eye
      "red" before they have seen a single real state. Coral and every red-adjacent hue are
      excluded with it — the nearest neighbour to the on-air red stays off the boot screen.

      TWO KINDS OF COLOUR LIVE HERE, and the difference is the whole doctrine:

        · INSTRUMENT — background, frame lines, inks, the rail, the scene's rows, wires and
          monitor. Every one MIRRORS a `--r-*` token from `theme.ts` `cssVars`, named in the
          comment beside it. It cannot READ the token: `controls.css` arrives with the
          bundle and the point is to paint before that.
        · CONTENT — the brand blue, and the graphics the scene puts on its monitor. These
          are declared ONCE as `--cg-*` constants on `.cg-splash` below. They are NOT tokens
          and must never become them: nothing in the console UI may wear them.

      `tests/splashCss.test.ts` pins both halves — every colour literal in this document is
      either a `--r-*` token value or one of those declared constants (a hand-picked colour
      belongs to neither and fails), and none of them is red or red-adjacent.

      FONTS — a system stack on purpose. The splash paints before any webfont can load, and
      a font swap on the product's first frame is exactly the wrong first impression.
    -->
    <style>
      .cg-splash {
        /* ── THE SPLASH-LOCAL CONSTANTS ──────────────────────────────────────────────
           Declared once, here, and deliberately NOT in `theme.ts` / `controls.css`.

           `--cg-brand` is APASAI's exact brand blue. It is the company's value, not ours:
           it is not adjusted for contrast, for consistency, or for a theme. The splash is
           the BRAND screen, so its chrome speaks this rather than the console's sky
           `--r-accent` — and that is a SPLASH-LOCAL decision. The app's own `--r-accent`
           is untouched by it.

           `--cg-violet` and `--cg-amber` are SCENE CONTENT: they colour the graphics the
           little monitor puts on air, not the instrument around them. That is what a real
           console looks like — a neutral instrument showing colourful output — and it is
           why they may never migrate into the UI palette. */
        --cg-brand: #00aeef;
        --cg-brand-deep: #0090c9;
        --cg-violet: #a78bfa;
        --cg-amber: #fbbf24;
        /* The lower third's white text and the ticker's dark ink: both are content INSIDE
           the depicted graphic, not UI inks. */
        --cg-lt-ink: #ffffff;
        --cg-ticker-ink: #0a2e21;
        /* The PLAY triangles and the ticker bed are the console's OWN success green — the
           colour that already means go/healthy in this app — so this one is a token
           mirror, not a splash-local invention. mirrors: --r-success */
        --cg-ok: #10b981;

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a212d; /* mirrors: --r-splash-bg */
        color: #e8edf4; /* mirrors: --r-splash-ink */
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* The fade is 450ms; an INVISIBLE full-screen overlay that still swallows clicks for
         those 450ms is a worse bug than no fade at all. */
      .cg-splash[data-dismissing='true'] {
        opacity: 0;
        pointer-events: none;
      }
      .cg-splash::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        /* Softer AND starting later (52%, not 35%) now that the ground is a lifted panel
           rather than near-black: a heavy vignette darkens the corners until the panel
           stops reading as one rectangle. mirrors: --r-splash-vignette */
        background: radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.22) 100%);
      }

      /* MOTION 1 — the raster sweep: a monitor refreshing. Barely there on purpose, and
         the only ambient motion on the screen. The brand hue is applied at full strength
         and dimmed with `opacity` rather than written as an `rgba()`, so the constant is
         still declared exactly once. */
      .cg-splash__scan {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 190px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.055;
        background: linear-gradient(to bottom, transparent, var(--cg-brand) 46%, transparent);
        transform: translateY(-190px);
        animation: cg-scan 5.6s linear 1.1s infinite;
      }
      @keyframes cg-scan {
        to {
          transform: translateY(100vh);
        }
      }

      /* Safe-area corner brackets — the frame a broadcast console draws around itself.
         The little monitor inside the scene carries the same ticks; that rhyme is
         deliberate. */
      .cg-splash__marks {
        position: absolute;
        inset: 40px;
        pointer-events: none;
        z-index: 2;
      }
      .cg-splash__marks i {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid #3d4959; /* mirrors: --r-splash-line */
        opacity: 0;
        animation: cg-fade 0.7s ease forwards;
      }
      .cg-splash__marks i:nth-child(1) {
        top: 0;
        left: 0;
        border-right: 0;
        border-bottom: 0;
        animation-delay: 0.06s;
      }
      .cg-splash__marks i:nth-child(2) {
        top: 0;
        right: 0;
        border-left: 0;
        border-bottom: 0;
        animation-delay: 0.14s;
      }
      .cg-splash__marks i:nth-child(3) {
        bottom: 0;
        left: 0;
        border-right: 0;
        border-top: 0;
        animation-delay: 0.22s;
      }
      .cg-splash__marks i:nth-child(4) {
        bottom: 0;
        right: 0;
        border-left: 0;
        border-top: 0;
        animation-delay: 0.3s;
      }

      .cg-splash__stage {
        position: relative;
        z-index: 2;
        width: min(560px, 78vw);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ══ THE PLAYOUT SCENE ═══════════════════════════════════════════════════════════
         The Runtime doing the only thing it does: a stack of layer rows on the left, a
         program monitor on the right, and a take travelling between them. One 7.2 s story
         loop, entirely in CSS keyframes on the class hooks below — no JS animation and no
         per-frame script work, because this runs WHILE the bundle parses and React makes
         its first commit.

         EVERY LOOPING KEYFRAME ANIMATES `transform` AND `opacity` ONLY. Anything that
         triggers layout per frame would steal main-thread time from the boot this screen
         exists to cover. The wipes are `scaleX` with an explicit origin (SVG needs
         `transform-box: fill-box`), never an animated `width` or `x`. The single
         exception in this document is `cg-widen` on the rule, and it is one-shot. */
      .cg-splash__scene {
        width: min(400px, 66vw);
        margin-bottom: 28px;
        opacity: 0;
        animation: cg-rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) 0.05s forwards;
      }

      /* THE INSTRUMENT — rows, wires, monitor. One neutral hue, tokens throughout. */
      .cg-splash__scene .row rect,
      .cg-splash__scene .mon {
        stroke: #3d4959; /* mirrors: --r-splash-line */
      }
      .cg-splash__scene .wire line,
      .cg-splash__scene .wire path {
        stroke: #2c3644; /* mirrors: --r-splash-rail */
      }
      .cg-splash__scene .rowbar rect {
        fill: #3a4557; /* mirrors: --r-splash-scene-bar */
      }
      /* Armed rows and the command dots: the brand hue, because they are the console
         speaking, not content. */
      .cg-splash__scene .hl1,
      .cg-splash__scene .hl2 {
        stroke: var(--cg-brand);
      }
      .cg-splash__scene .dot1,
      .cg-splash__scene .dot2 {
        fill: var(--cg-brand);
      }
      /* PLAY is the console's own success green — the colour that already means go. */
      .cg-splash__scene .tri1,
      .cg-splash__scene .tri2 {
        fill: var(--cg-ok);
      }

      /* THE CONTENT — what the monitor is showing. The lower third carries the same
         silhouette and the same blue→violet strap the Designer's splash assembles: built
         there, played here. */
      .cg-splash__scene .cg-ag-from {
        stop-color: var(--cg-brand);
      }
      .cg-splash__scene .cg-ag-to {
        stop-color: var(--cg-violet);
      }
      .cg-splash__scene .lt-strap {
        fill: url(#cg-ag);
      }
      .cg-splash__scene .lt-ink {
        fill: var(--cg-lt-ink);
      }
      .cg-splash__scene .bug {
        fill: var(--cg-amber);
      }
      .cg-splash__scene .tk-bed {
        fill: var(--cg-ok);
      }
      .cg-splash__scene .tkd rect {
        fill: var(--cg-ticker-ink);
      }

      /* Everything the loop brings on starts hidden, so the first frame is a bare
         instrument and the story begins only once the entrance has settled. */
      .cg-splash__scene .hl1,
      .cg-splash__scene .tri1,
      .cg-splash__scene .hl2,
      .cg-splash__scene .tri2,
      .cg-splash__scene .dot1,
      .cg-splash__scene .dot2,
      .cg-splash__scene .bug {
        opacity: 0;
      }
      .cg-splash__scene .lt,
      .cg-splash__scene .tk {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
      }
      .cg-splash__scene .bug {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* THE BEAT MAP, AND THE TIMING IS A HARD REQUIREMENT — NOT DECORATION.
         The loop starts at 0.85s and runs 6s. The previous shape (start 1.9s, 7.2s cycle)
         put the bug and ticker at ~6.3s — more than a second AFTER the then-5s cold start
         had already closed — so nobody ever saw beat four. The scene was telling a story
         with an audience for only its first sentence. (The cold floor has since moved to
         8s, which makes the fit comfortable rather than tight; the requirement below is
         unchanged, because the floor is the owner's to move and this scene must survive it
         moving back.)

         What actually makes it fit is not just starting earlier: THE GRAPHICS STACK
         INSTEAD OF TAKING TURNS. Row 2 arms while the lower third is still on air, so a
         strap, a bug and a ticker end up live together — which is also what a real playout
         looks like. Everything lands by ~3s and holds for the rest of the cold start.

              ~1.0s  row 1 arms                ~2.2-2.9s  row 2 arms, its dot crosses,
              ~1.5s  its command dot crosses              amber bug + emerald ticker join
              ~1.8s  lower third wipes ON      ~3.0-5.1s  the full package holds, then
                                                          clears; both rows release

         If a future edit pushes any beat past ~3s, the scene is back to telling a story
         nobody watches. Check it against the SHORTEST floor the product ships, not the
         current one — 5s was that floor when this was written. */
      .cg-splash__scene .hl1,
      .cg-splash__scene .tri1 {
        animation: cg-take1 6s ease-in-out 0.85s infinite;
      }
      .cg-splash__scene .dot1 {
        animation: cg-go1 6s linear 0.85s infinite;
      }
      .cg-splash__scene .lt {
        animation: cg-air1 6s ease-in-out 0.85s infinite;
      }
      .cg-splash__scene .hl2,
      .cg-splash__scene .tri2 {
        animation: cg-take2 6s ease-in-out 0.85s infinite;
      }
      .cg-splash__scene .dot2 {
        animation: cg-go2 6s linear 0.85s infinite;
      }
      .cg-splash__scene .bug {
        animation: cg-air2 6s ease-in-out 0.85s infinite;
      }
      .cg-splash__scene .tk {
        animation: cg-air3 6s ease-in-out 0.85s infinite;
      }
      .cg-splash__scene .tkd {
        animation: cg-crawl 6s linear 0.85s infinite;
      }

      @keyframes cg-take1 {
        0% {
          opacity: 0;
        }
        3% {
          opacity: 1;
        }
        78% {
          opacity: 1;
        }
        82% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes cg-go1 {
        0%,
        3% {
          opacity: 0;
          transform: translateX(0);
        }
        5% {
          opacity: 1;
        }
        10% {
          opacity: 1;
          transform: translateX(46px);
        }
        12% {
          opacity: 0;
          transform: translateX(46px);
        }
        100% {
          opacity: 0;
          transform: translateX(0);
        }
      }
      @keyframes cg-air1 {
        0%,
        10% {
          opacity: 0;
          transform: scaleX(0);
        }
        12% {
          opacity: 1;
        }
        16% {
          transform: scaleX(1);
        }
        70% {
          opacity: 1;
          transform: scaleX(1);
        }
        76% {
          opacity: 1;
          transform: scaleX(0);
        }
        77%,
        100% {
          opacity: 0;
          transform: scaleX(0);
        }
      }
      @keyframes cg-take2 {
        0%,
        20% {
          opacity: 0;
        }
        23% {
          opacity: 1;
        }
        82% {
          opacity: 1;
        }
        86% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes cg-go2 {
        0%,
        23% {
          opacity: 0;
          transform: translateX(0);
        }
        25% {
          opacity: 1;
        }
        30% {
          opacity: 1;
          transform: translateX(46px);
        }
        32% {
          opacity: 0;
          transform: translateX(46px);
        }
        100% {
          opacity: 0;
          transform: translateX(0);
        }
      }
      @keyframes cg-air2 {
        0%,
        30% {
          opacity: 0;
          transform: scale(0.3);
        }
        35% {
          opacity: 1;
          transform: scale(1);
        }
        72% {
          opacity: 1;
          transform: scale(1);
        }
        78% {
          opacity: 0;
          transform: scale(0.6);
        }
        100% {
          opacity: 0;
          transform: scale(0.3);
        }
      }
      @keyframes cg-air3 {
        0%,
        30% {
          opacity: 0;
          transform: scaleX(0);
        }
        35% {
          opacity: 1;
          transform: scaleX(1);
        }
        72% {
          opacity: 1;
          transform: scaleX(1);
        }
        78% {
          opacity: 0;
          transform: scaleX(0);
        }
        100% {
          opacity: 0;
          transform: scaleX(0);
        }
      }
      @keyframes cg-crawl {
        0%,
        32% {
          transform: translateX(-12px);
        }
        76%,
        100% {
          transform: translateX(10px);
        }
      }

      .cg-splash__wordmark {
        margin: 0;
        line-height: 1;
        color: #e8edf4; /* mirrors: --r-splash-ink */
        font-weight: 250;
        font-size: clamp(30px, 5.6vw, 46px);
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        opacity: 0;
        animation: cg-rise 1s cubic-bezier(0.2, 0.7, 0.3, 1) 0.3s forwards;
      }
      /* CG is the PLATFORM; the suffix is the ROLE this app plays in it. The weight split
         says that in one glance, and the Designer's splash uses the same rule. */
      .cg-splash__wordmark b {
        font-weight: 650;
      }
      .cg-splash__rule {
        height: 1px;
        width: 0;
        margin-top: 22px;
        /* mirrors: --r-splash-line */
        background: linear-gradient(to right, transparent, #3d4959 20%, #3d4959 80%, transparent);
        /* The ONE animated `width` in this document, and the only acceptable one: it is
           ONE-SHOT and finished by ~1.6s. Every LOOP above is compositor-only. */
        animation: cg-widen 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) 0.5s forwards;
      }
      /* THE COMPANY LOCKUP — the mark plus the wordmark, signing the composition. */
      .cg-splash__company {
        margin: 20px 0 0;
        display: flex;
        align-items: center;
        gap: 15px;
        opacity: 0;
        animation: cg-rise 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) 0.6s forwards;
      }
      .cg-splash__logo {
        display: block;
        height: 48px;
        width: auto;
      }
      /* RELIT FOR A DARK GROUND, and only these two: the bars are near-black in the source
         artwork and the swoosh mid-grey, both of which vanish on this background. THE ARC
         IS NOT TOUCHED — `#00AEEF` is APASAI's exact brand blue and is not ours to alter,
         not for contrast, not for consistency, not for a theme. Recolouring happens HERE,
         on the three class hooks; the path data is never edited. */
      .cg-splash__logo .apasai-bars {
        fill: #eef3f9; /* mirrors: --r-splash-logo-bars */
      }
      .cg-splash__logo .apasai-swoosh {
        fill: #5c6a7c; /* mirrors: --r-splash-logo-swoosh */
      }
      .cg-splash__logo .apasai-arc {
        fill: var(--cg-brand);
      }
      .cg-splash__company span {
        font-size: 13px;
        font-weight: 650;
        color: #c9d3df; /* mirrors: --r-splash-company-ink */
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        line-height: 1;
      }
      .cg-splash__tagline {
        margin: 9px 0 0;
        font-size: 11.5px;
        letter-spacing: 0.05em;
        color: #5a6675; /* mirrors: --r-splash-ink-dim */
        opacity: 0;
        animation: cg-rise 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) 0.72s forwards;
      }

      .cg-splash__progress {
        width: 100%;
        margin-top: 52px;
        opacity: 0;
        animation: cg-rise 0.9s ease 0.95s forwards;
      }
      .cg-splash__rail {
        position: relative;
        height: 2px;
        border-radius: 2px;
        background: #2c3644; /* mirrors: --r-splash-rail */
        overflow: hidden;
      }
      /* The rail's width and the percentage beside it are THE SAME NUMBER — one definition,
         `splashProgress()` in `src/renderer/splashTiming.ts`:

             min( elapsed / floor , completed steps / total steps )

         It is progress TOWARD THE DOOR OPENING, which is what the operator is waiting on.
         The `min` gates the clock against work that has genuinely finished, so it is never
         ahead of real boot and it visibly parks on a step that is slow; it reads 100 only
         when the floor has elapsed AND boot is done, which is exactly when the splash may
         go. The transition below smooths the DISPLAYED value between 100 ms ticks and does
         nothing else — there is no easing beyond that and no timer inventing progress. */
      /* SCALED, not widened. The readout re-renders ten times a second for the whole hold,
         and an animated `width` would be ~50 layout invalidations during the exact window
         the bundle is parsing. `scaleX` is compositor-only and looks identical. */
      .cg-splash__fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
        background: linear-gradient(to right, var(--cg-brand-deep), var(--cg-brand));
        box-shadow: 0 0 14px rgba(0, 174, 239, 0.5); /* mirrors: --r-splash-glow */
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .cg-splash__readout {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10.5px;
        letter-spacing: 0.13em;
        color: #8b97a6; /* mirrors: --r-splash-readout */
      }
      /* Tabular figures: without them the percentage jitters horizontally as the digits
         change, on a screen whose whole job is to look composed. */
      #cg-splash-pct {
        font-variant-numeric: tabular-nums;
      }
      /* WHEN BOOT COMPLETES THE LABEL LEAVES — it does not settle on a word.
         A fast cold boot is done about a second in while the door stays shut until the
         floor, so a terminal "READY" would be the thing on screen for MOST of the
         splash at exactly the moment the operator still cannot use the app. The
         percentage carries the remaining hold on its own and the left side goes empty. */
      #cg-splash-phase {
        transition: opacity 0.35s ease;
      }
      .cg-splash__readout[data-done='true'] #cg-splash-phase {
        opacity: 0;
      }

      /* BELOW the corner brackets, not level with them. The brackets sit at `inset: 40px`
         and their horizontal arms run right through a foot at the reference's 34px — the
         stamp came out struck through. 18px clears the arm at every viewport height,
         because both are anchored to the same bottom edge. */
      .cg-splash__foot {
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        bottom: 18px;
        padding: 0 46px;
        display: flex;
        justify-content: space-between;
        color: #55637a; /* mirrors: --r-splash-ink-faint */
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        opacity: 0;
        animation: cg-rise 0.9s ease 1.15s forwards;
      }

      @keyframes cg-rise {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes cg-widen {
        from {
          width: 0;
        }
        to {
          width: min(360px, 60vw);
        }
      }
      /* The corner brackets' arrival. They rest at `opacity: 0`, so WITHOUT this keyframe
         they are simply never drawn — which is exactly what happened once. */
      @keyframes cg-fade {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        /* Everything stops — but the scene is NOT blanked. It settles on the FULL PACKAGE:
           both rows armed, the lower third, the bug and the ticker all on the monitor.
           That is the scene's own resting state now that the graphics STACK rather than
           take turns (see the beat map), so it is the honest still of it — a reader who
           cannot take motion gets the whole sentence, held. Only the command dots stay
           hidden: a dot frozen mid-wire depicts a message in flight, which is the one
           thing a still frame cannot mean. */
        .cg-splash *,
        .cg-splash *::before,
        .cg-splash *::after {
          animation: none !important;
          transition: none !important;
        }
        .cg-splash__scene,
        .cg-splash__wordmark,
        .cg-splash__company,
        .cg-splash__tagline,
        .cg-splash__progress,
        .cg-splash__foot,
        .cg-splash__marks i {
          opacity: 1 !important;
          transform: none !important;
        }
        .cg-splash__rule {
          width: min(360px, 60vw);
        }
        .cg-splash__scan {
          display: none;
        }
        .cg-splash__scene .hl1,
        .cg-splash__scene .tri1,
        .cg-splash__scene .hl2,
        .cg-splash__scene .tri2,
        .cg-splash__scene .bug {
          opacity: 1 !important;
          transform: none !important;
        }
        .cg-splash__scene .lt,
        .cg-splash__scene .tk {
          opacity: 1 !important;
          transform: scaleX(1) !important;
        }
        .cg-splash__scene .dot1,
        .cg-splash__scene .dot2 {
          opacity: 0 !important;
        }
        .cg-splash {
          transition: opacity 0.01s !important;
        }
      }

    <!--
      ══ R-035 · STARTUP SPLASH — THE CLOCK ════════════════════════════════════════
      A classic (non-module) script, so it runs BEFORE the deferred module bundle. It owns
      `t0`, because first paint is the only honest start for this clock: a clock started
      from module scope is already late by exactly the parse time this screen exists to
      cover.

      The arithmetic it implements is stated as a pure function in
      `src/renderer/splashTiming.ts`. That duplication is real, and it is CONTAINED rather
      than denied: `tests/splash.dom.test.ts` runs THIS script in jsdom and asserts its
      constants and its dismissal instant against that module.
    -->
    <script>
      (function () {
        var el = document.getElementById('cg-splash');
        if (!el) return;

        // The test-suite door, read FIRST. An init-script global — deliberately NOT a URL
        // query parameter, which is a door an operator can reach by bookmark or typo.
        // Set ⇒ the splash never exists: no clock, no timers, no hold.
        if (window.__CG_SPLASH_DISABLED__) {
          el.remove();
          return;
        }

        // Mirrors of `splashTiming.ts` — see this block's header.
        var COLD_FLOOR_MS = 8000;
        var WARM_FLOOR_MS = 3000;
        var CEILING_MS = 20000;
        var FADE_MS = 450;
        var TICK_MS = 100;
        var SESSION_KEY = 'CG_RUNTIME_SESSION';
        // THREE LABELS, THREE WORK STEPS, each naming the work happening NOW. There is no
        // terminal label: see `splashTiming.ts` and the `#cg-splash-phase` rule above for
        // why the label leaves on completion instead of settling on a word.
        var PHASES = ['INITIALIZING', 'PROBING BRIDGE', 'STARTING INTERFACE'];

        var t0 = Date.now();

        // Cold vs warm. `sessionStorage` survives F5 in the same tab and is empty in a new
        // tab or a new browser, so its ABSENCE is the cold signal exactly — no threshold to
        // guess. A browser that refuses storage is treated as cold rather than failing boot.
        var coldStart = true;
        try {
          coldStart = window.sessionStorage.getItem(SESSION_KEY) === null;
          window.sessionStorage.setItem(SESSION_KEY, '1');
        } catch (e) {
          coldStart = true;
        }
        var floorMs = coldStart ? COLD_FLOOR_MS : WARM_FLOOR_MS;

        var fillEl = document.getElementById('cg-splash-fill');
        var phaseEl = document.getElementById('cg-splash-phase');
        var pctEl = document.getElementById('cg-splash-pct');
        var readoutEl = document.getElementById('cg-splash-readout');

        var dismissed = false;
        var bootDone = false;
        var holdTimer = null;
        var tickTimer = null;
        // Steps FINISHED. A label names the work happening NOW, so it is not complete
        // while it is showing: `completed` reaches PHASES.length at done(), never before.
        var completed = 0;
        var progress = 0;

        // The mirror of `splashProgress()` / `splashProgressPercent()` in
        // `src/renderer/splashTiming.ts` — see this block's header for how the duplication
        // is contained. FLOOR rather than round: a screen reading 100 while the door is
        // still shut is the same false claim as a terminal READY label.
        function render() {
          var byTime = (Date.now() - t0) / floorMs;
          var bySteps = completed / PHASES.length;
          progress = Math.max(progress, Math.min(1, Math.max(0, Math.min(byTime, bySteps))));
          var pct = Math.floor(progress * 100);
          // The rail is SCALED rather than widened — same number, no layout per tick.
          if (fillEl) fillEl.style.transform = 'scaleX(' + pct / 100 + ')';
          if (pctEl) pctEl.textContent = pct + '%';
        }

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          clearTimeout(ceilingTimer);
          if (holdTimer !== null) clearTimeout(holdTimer);
          // One last reading BEFORE the ticker stops, so the rail lands on the number the
          // moment of dismissal actually earned: 100 on a completed hold, and honestly
          // less than that when the 20 s ceiling is what ended it.
          render();
          if (tickTimer !== null) clearInterval(tickTimer);
          el.setAttribute('data-dismissing', 'true');
          setTimeout(function () {
            // REMOVE it, don't just hide it: a full-screen overlay left in the DOM is a
            // click swallower waiting to be rediscovered.
            if (el.parentNode) el.parentNode.removeChild(el);
          }, FADE_MS);
        }

        function phase(key) {
          var i = PHASES.indexOf(key);
          if (i < 0 || dismissed) return;
          // Entering step `i` means the `i` steps BEFORE it are behind us. Monotone, so a
          // phase reported out of order cannot walk the readout backwards.
          if (i > completed) completed = i;
          if (phaseEl) phaseEl.textContent = key;
          render();
        }

        function done() {
          // Idempotent: the hold is scheduled from the FIRST completion signal only. React
          // StrictMode re-runs effects in development, so this is called twice as a matter
          // of course.
          if (bootDone || dismissed) return;
          bootDone = true;
          // The LAST step completes here and nowhere earlier, which is what makes 100%
          // mean "the door is about to open" rather than "the last label appeared".
          completed = PHASES.length;
          // The label LEAVES rather than settling on a word — the percentage carries the
          // rest of the hold alone. See the `#cg-splash-phase` rule for why.
          if (readoutEl) readoutEl.setAttribute('data-done', 'true');
          render();
          var now = Date.now();
          // dismissAt = min( max(t0 + floor, bootDone), t0 + ceiling )
          var dismissAt = Math.min(Math.max(t0 + floorMs, now), t0 + CEILING_MS);
          holdTimer = setTimeout(dismiss, Math.max(0, dismissAt - now));
        }

        // The CEILING is armed at t0 and never disarmed except by dismissal. On an on-air
        // tool a stuck splash means the operator has no door into the application at all;
        // at the ceiling it goes regardless of boot state and the app's own DISCONNECTED
        // surface — which already exists — takes over.
        var ceilingTimer = setTimeout(dismiss, CEILING_MS);
        // The readout's clock half. An interval, NOT `requestAnimationFrame`: this screen
        // runs while the bundle parses and React commits, and per-frame script work would
        // be taken from the boot it exists to cover.
        tickTimer = setInterval(render, TICK_MS);

        window.__CG_SPLASH__ = { phase: phase, done: done };
        phase('INITIALIZING');
      })();
    </script>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
