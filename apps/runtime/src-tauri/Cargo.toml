[package]
name = "cg-control"
version = "0.1.0"
description = "CG Control: the Runtime console and its CasparCG bridge, as one Windows app (ADR 0011)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
