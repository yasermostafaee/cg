<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>APASAI CG CONTROL</title>
    <!--
      DESKTOP-APPS-01 — what the window shows until the bridge answers on the console origin,
      and what it shows if it never does. No prose: the name, a bar, and on failure the
      sentence the shell produced, who holds a port, and where the log is.
    -->
    <link rel="stylesheet" href="start.css" />
    <script src="start.js" defer></script>
  </head>
  <body data-state="starting">
    <main>
      <p class="name">CG Control</p>
      <div class="bar" aria-hidden="true"><span></span></div>
      <section class="failed" role="alert">
        <p id="message"></p>
        <ul id="held"></ul>
        <p id="log"></p>
      </section>
    </main>
  </body>
</html>
