<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws: wss: http: https: blob: data:; frame-src 'self' blob:; child-src 'self' blob:; worker-src 'self' blob:; base-uri 'none'"
    />
    <title>cg Designer</title>

    <!--
      ══ STARTUP SPLASH — CRITICAL CSS ═════════════════════════════════════════════

      Inline, in `<head>`, because this must paint on the FIRST FRAME: no bundle, no
      stylesheet request, no webfont. A React splash cannot exist during the window it is
      for — the bundle has to parse and `initDesignerPlatform()` has to resolve before any
      component can mount, which is precisely the window being covered.

      AND IT CANNOT GO THROUGH VANILLA-EXTRACT, which is the app's real styling system:
      vanilla-extract compiles at BUNDLE time, and this needs to be styled before the bundle
      exists. An inline `<style>` here is therefore correct rather than a design-system
      violation — please do not "fix" it into a `.css.ts` file. Nothing else in the Designer
      is styled this way and nothing else should be.

      THE SPLASH SURFACE IS DELIBERATELY LIGHTER THAN THE APP. It reads as a panel lifted off
      the console behind it, so the fade-out is a curtain rising rather than one dark screen
      becoming another. Every value below is SPLASH-LOCAL — declared once as a `--cg-*`
      constant on `.cg-splash` — and the app's own background and border tokens are untouched
      by any of it.

      COLOUR: five hues, and that is a deliberate difference from the Runtime splash. The
      Runtime is an air surface where red is sacred, so it carries a hard no-red rule and its
      chrome is one restrained accent. The Designer is not an air surface; a five-hue palette
      is what a design tool looks like, and it lives in the artboard's CONTENT. The chrome
      around it — rail, handles, frame — stays the one brand accent, exactly as the Runtime's
      does, because that is what makes the two read as one family.

      FONTS — a system stack on purpose. The splash paints before any webfont can load, and a
      font swap on the product's first frame is exactly the wrong first impression.
    -->
    <style>
      .cg-splash {
        /* ── THE SPLASH-LOCAL CONSTANTS ──────────────────────────────────────────────
           Declared once, here. NONE of these is an app token and none may become one: the
           Designer's own theme is untouched by this screen.

           `--cg-brand` is APASAI's exact brand blue. It is the company's value, not ours: it
           is not adjusted for contrast, for consistency, or for a theme.

           THE FIVE HUES are the artboard's CONTENT — the graphic being designed, not the
           instrument drawing it. Removing the coral (if the Runtime's no-red rule is ever
           extended to this product) is a one-line swap of `--cg-coral` and nothing else. */
        --cg-brand: #00aeef;
        --cg-brand-deep: #0090c9;
        --cg-violet: #a78bfa;
        --cg-amber: #fbbf24;
        --cg-emerald: #34d399;
        --cg-coral: #fb7185;

        /* THE SURFACE. A panel lifted off the console, not the app's near-black. The whole
           family moves together or not at all — the subtle border is within a few points of
           the ground, so lifting the ground alone would leave the rail with no visible
           track. */
        --cg-ground: #1a212d;
        --cg-line-subtle: #2c3644; /* rail track */
        --cg-line-strong: #3d4959; /* artboard frame, hairline rule */
        --cg-grid: #252f3e; /* artboard grid lines */
        --cg-handle-fill: #101722;
        --cg-handle-line: #4a5768;
        --cg-ink: #e8edf4;
        --cg-ink-dim: #5a6675;
        --cg-ink-faint: #55637a; /* foot */
        --cg-readout: #8b97a6;
        --cg-company-ink: #c9d3df;
        --cg-logo-bars: #eef3f9;
        --cg-logo-swoosh: #5c6a7c;
        --cg-lt-ink: #ffffff;

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cg-ground);
        color: var(--cg-ink);
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* The fade is 450ms; an INVISIBLE full-screen overlay that still swallows clicks for
         those 450ms is a worse bug than no fade at all. */
      .cg-splash[data-dismissing='true'] {
        opacity: 0;
        pointer-events: none;
      }
      .cg-splash::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        /* Soft, and starting late (52%): a heavy vignette on a lifted panel darkens the
           corners until the panel stops reading as one rectangle. */
        background: radial-gradient(120% 90% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.22) 100%);
      }

      /* THE RASTER SWEEP — shared with the Runtime splash, identical values. It is the one
         motion the two products have in common. The brand hue is applied at full strength and
         dimmed with `opacity` rather than written as an `rgba()`, so the constant stays
         declared exactly once. */
      .cg-splash__scan {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 190px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.05;
        background: linear-gradient(to bottom, transparent, var(--cg-brand) 46%, transparent);
        transform: translateY(-190px);
        animation: cg-scan 5.6s linear 1.1s infinite;
      }
      @keyframes cg-scan {
        to {
          transform: translateY(100vh);
        }
      }

      /* THE ARTBOARD FRAME — the Designer's counterpart to the Runtime's safe-area corner
         brackets: a selected rectangle with eight handles. Same idea (this app frames its own
         screen the way it frames a composition), different vocabulary. */
      .cg-splash__board {
        position: absolute;
        inset: 44px;
        z-index: 2;
        pointer-events: none;
        border: 1px solid var(--cg-line-strong);
        opacity: 0;
        animation: cg-fade 0.7s ease 0.06s forwards;
      }
      .cg-splash__board i {
        position: absolute;
        width: 7px;
        height: 7px;
        background: var(--cg-handle-fill);
        border: 1px solid var(--cg-handle-line);
      }
      .cg-splash__board i:nth-child(1) {
        top: -4px;
        left: -4px;
      }
      .cg-splash__board i:nth-child(2) {
        top: -4px;
        right: -4px;
      }
      .cg-splash__board i:nth-child(3) {
        bottom: -4px;
        left: -4px;
      }
      .cg-splash__board i:nth-child(4) {
        bottom: -4px;
        right: -4px;
      }
      .cg-splash__board i:nth-child(5) {
        top: -4px;
        left: calc(50% - 4px);
      }
      .cg-splash__board i:nth-child(6) {
        bottom: -4px;
        left: calc(50% - 4px);
      }
      .cg-splash__board i:nth-child(7) {
        left: -4px;
        top: calc(50% - 4px);
      }
      .cg-splash__board i:nth-child(8) {
        right: -4px;
        top: calc(50% - 4px);
      }

      .cg-splash__stage {
        position: relative;
        z-index: 2;
        width: min(560px, 78vw);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ══ THE ARTBOARD SCENE ═══════════════════════════════════════════════════════════
         One SVG, one story: THE PATH YOU DESIGN BECOMES THE GRAPHIC ON AIR. A motion path
         draws itself, keyframes land on it, and the lower third it produces assembles
         beneath — the same silhouette and strap gradient the Runtime splash plays on its
         program monitor. Built here, played there.

         EVERY LOOPING KEYFRAME ANIMATES `transform` AND `opacity` ONLY. This runs while the
         app is booting, so anything that costs layout per frame is taken from the very boot
         it covers. The one exception is the path's entrance, which animates
         `stroke-dashoffset` — paint-only, not layout, and one-shot. All wipes and grows are
         `scaleX` with an explicit origin (SVG needs `transform-box: fill-box`), never an
         animated `width` or `x`.

         THE COMPOSITION RESTS BY ~1.6s: the last entrance is the playhead's fade at
         1.55s + 0.5s, and every ambient loop starts at 1.7s or later so nothing competes
         with the composition arriving. */
      .cg-splash__scene {
        width: min(400px, 66vw);
        margin-bottom: 26px;
        opacity: 0;
        animation: cg-rise 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) 0.1s forwards;
      }

      .cg-splash__scene .grid line {
        stroke: var(--cg-grid);
      }
      /* The two gradients, coloured through CSS like everything else, so the five hues stay
         declared in exactly one place. */
      .cg-splash__scene .pg-a,
      .cg-splash__scene .sg-a {
        stop-color: var(--cg-brand);
      }
      .cg-splash__scene .pg-b,
      .cg-splash__scene .sg-b {
        stop-color: var(--cg-violet);
      }
      .cg-splash__scene .pg-c {
        stop-color: var(--cg-coral);
      }

      .cg-splash__scene .path {
        stroke: url(#cg-pg);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        /* The draw-on. `pathLength="1"` normalises the dash units so this needs no measured
           geometry — edit the `d` and the entrance still works. `stroke-dashoffset` is
           PAINT-only (it costs no layout) and this is one-shot, which is why it is the single
           property here outside transform/opacity. */
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: cg-draw 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.22s forwards;
      }

      /* Keyframe diamonds: 12px squares turned 45°. The rotation is part of the RESTING
         state, so every keyframe touching them carries it or they would snap square. */
      .cg-splash__scene .kf {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
      }
      .cg-splash__scene .kf1 {
        fill: var(--cg-brand);
      }
      .cg-splash__scene .kf2 {
        fill: var(--cg-violet);
      }
      .cg-splash__scene .kf3 {
        fill: var(--cg-amber);
      }
      .cg-splash__scene .kf4 {
        fill: var(--cg-emerald);
      }

      /* The lower third, assembling piece by piece. */
      .cg-splash__scene .strap {
        fill: url(#cg-sg);
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
      }
      .cg-splash__scene .l1,
      .cg-splash__scene .l2 {
        fill: var(--cg-lt-ink);
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation: cg-grow 0.42s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      }
      .cg-splash__scene .l1 {
        animation-delay: 0.82s;
      }
      .cg-splash__scene .l2 {
        animation-delay: 0.92s;
      }
      .cg-splash__scene .bug {
        fill: var(--cg-amber);
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
      }
      .cg-splash__scene .tick {
        fill: var(--cg-emerald);
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
      }
      .cg-splash__scene .dot {
        fill: var(--cg-coral);
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
      }
      .cg-splash__scene .head {
        fill: var(--cg-coral);
        transform-box: fill-box;
        opacity: 0;
      }

      /* ENTRANCE + AMBIENT, declared together per element so there is one `animation` per
         hook rather than a base rule quietly overridden by a later one. Every ambient loop
         starts at 1.7s or later — after the composition has rested. */
      .cg-splash__scene .kf1 {
        animation:
          cg-kf 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 0.72s forwards,
          cg-shimmer 3.2s ease-in-out 1.7s infinite;
      }
      .cg-splash__scene .kf2 {
        animation:
          cg-kf 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 0.92s forwards,
          cg-shimmer 3.2s ease-in-out 1.9s infinite;
      }
      .cg-splash__scene .kf3 {
        animation:
          cg-kf 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 1.08s forwards,
          cg-shimmer 3.2s ease-in-out 2.1s infinite;
      }
      .cg-splash__scene .kf4 {
        animation:
          cg-kf 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 1.22s forwards,
          cg-shimmer 3.2s ease-in-out 2.3s infinite;
      }
      .cg-splash__scene .strap {
        animation:
          cg-wipe 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 0.5s forwards,
          cg-breathe 4.5s ease-in-out 1.8s infinite;
      }
      .cg-splash__scene .bug {
        animation:
          cg-pop 0.44s cubic-bezier(0.2, 0.8, 0.3, 1) 0.98s forwards,
          cg-spin 9s linear 1.8s infinite;
      }
      .cg-splash__scene .tick {
        animation:
          cg-wipe 0.46s cubic-bezier(0.2, 0.8, 0.3, 1) 1.08s forwards,
          cg-pulse 3.4s ease-in-out 1.8s infinite;
      }
      .cg-splash__scene .dot {
        animation:
          cg-pop 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) 1.18s forwards,
          cg-beat 2.4s ease-in-out 1.8s infinite;
      }
      .cg-splash__scene .head {
        animation:
          cg-headin 0.5s ease 1.55s forwards,
          cg-sweep 4.4s ease-in-out 2s infinite alternate;
      }

      @keyframes cg-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes cg-kf {
        from {
          opacity: 0;
          transform: rotate(45deg) scale(0.2);
        }
        to {
          opacity: 1;
          transform: rotate(45deg) scale(1);
        }
      }
      @keyframes cg-wipe {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes cg-grow {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes cg-pop {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes cg-headin {
        to {
          opacity: 0.55;
        }
      }
      @keyframes cg-shimmer {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @keyframes cg-breathe {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.94);
        }
      }
      @keyframes cg-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes cg-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      @keyframes cg-beat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.68);
        }
      }
      @keyframes cg-sweep {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(312px);
        }
      }

      .cg-splash__wordmark {
        margin: 0;
        line-height: 1;
        color: var(--cg-ink);
        font-weight: 250;
        font-size: clamp(30px, 5.6vw, 46px);
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        opacity: 0;
        animation: cg-rise 1s cubic-bezier(0.2, 0.7, 0.3, 1) 0.3s forwards;
      }
      /* CG is the PLATFORM; the suffix is the ROLE this app plays in it. The weight split
         says that in one glance, and the Runtime's splash uses the same rule. */
      .cg-splash__wordmark b {
        font-weight: 650;
      }
      .cg-splash__rule {
        height: 1px;
        width: 0;
        margin-top: 22px;
        background: linear-gradient(
          to right,
          transparent,
          var(--cg-line-strong) 20%,
          var(--cg-line-strong) 80%,
          transparent
        );
        /* The ONE animated `width` in this document, and the only acceptable one: it is
           ONE-SHOT and finished by ~1.6s. Every LOOP above is compositor-only. */
        animation: cg-widen 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) 0.5s forwards;
      }

      /* THE COMPANY LOCKUP — identical to the Runtime's, which is the point: it is the same
         company signing both halves of the same platform. */
      .cg-splash__company {
        margin: 20px 0 0;
        display: flex;
        align-items: center;
        gap: 15px;
        opacity: 0;
        animation: cg-rise 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) 0.6s forwards;
      }
      .cg-splash__logo {
        display: block;
        height: 48px;
        width: auto;
      }
      /* RELIT FOR A DARK GROUND, and only these two: the bars are near-black in the source
         artwork and the swoosh mid-grey, both of which vanish on this background. THE ARC IS
         NOT TOUCHED — `#00AEEF` is APASAI's exact brand blue and is not ours to alter, not
         for contrast, not for consistency, not for a theme. Recolouring happens HERE, on the
         three class hooks; the path data is never edited. */
      .cg-splash__logo .apasai-bars {
        fill: var(--cg-logo-bars);
      }
      .cg-splash__logo .apasai-swoosh {
        fill: var(--cg-logo-swoosh);
      }
      .cg-splash__logo .apasai-arc {
        fill: var(--cg-brand);
      }
      .cg-splash__company span {
        font-size: 13px;
        font-weight: 650;
        color: var(--cg-company-ink);
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        line-height: 1;
      }
      .cg-splash__tagline {
        margin: 9px 0 0;
        font-size: 11.5px;
        letter-spacing: 0.05em;
        color: var(--cg-ink-dim);
        opacity: 0;
        animation: cg-rise 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) 0.72s forwards;
      }

      .cg-splash__progress {
        width: 100%;
        margin-top: 46px;
        opacity: 0;
        animation: cg-rise 0.9s ease 0.95s forwards;
      }
      .cg-splash__rail {
        position: relative;
        height: 2px;
        border-radius: 2px;
        background: var(--cg-line-subtle);
        overflow: hidden;
      }
      /* The rail's width and the percentage beside it are THE SAME NUMBER — one definition,
         `splashProgress()` in `src/renderer/splashTiming.ts`:

             min( elapsed / floor , completed steps / total steps )

         It is progress TOWARD THE DOOR OPENING, which is what the operator is waiting on.
         The `min` gates the clock against work that has genuinely finished, so it is never
         ahead of real boot and it visibly parks on a step that is slow; it reads 100 only
         when the floor has elapsed AND boot is done, which is exactly when the splash may go.

         SCALED, not widened: the readout re-renders ten times a second for the whole hold,
         and an animated `width` would cost layout on every tick of it.

         THE RAIL CARRIES THE BRAND BLUE, not one of the five scene hues. The chrome is one
         accent in both products — a multi-hue rail would read as decoration and would break
         the family. */
      .cg-splash__fill {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
        background: linear-gradient(to right, var(--cg-brand-deep), var(--cg-brand));
        box-shadow: 0 0 14px rgba(0, 174, 239, 0.5);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .cg-splash__readout {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10.5px;
        letter-spacing: 0.13em;
        color: var(--cg-readout);
      }
      /* Tabular figures: without them the percentage jitters horizontally as the digits
         change, on a screen whose whole job is to look composed. */
      #cg-splash-pct {
        font-variant-numeric: tabular-nums;
      }
      /* WHEN BOOT COMPLETES THE LABEL LEAVES — it does not settle on a word. A fast cold boot
         is done about a second in while the door stays shut until the 8s floor, so a terminal
         "READY" would be the thing on screen for MOST of the splash at exactly the moment the
         operator still cannot use the app. The percentage carries the remaining hold on its
         own and the left side goes empty. */
      #cg-splash-phase {
        transition: opacity 0.35s ease;
      }
      .cg-splash__readout[data-done='true'] #cg-splash-phase {
        opacity: 0;
      }

      /* BELOW the artboard frame, not level with it: the frame sits at `inset: 44px` and a
         foot level with it would be struck through by its edge. */
      .cg-splash__foot {
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        bottom: 18px;
        padding: 0 50px;
        display: flex;
        justify-content: space-between;
        color: var(--cg-ink-faint);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        opacity: 0;
        animation: cg-rise 0.9s ease 1.15s forwards;
      }

      @keyframes cg-rise {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes cg-widen {
        from {
          width: 0;
        }
        to {
          width: min(360px, 60vw);
        }
      }
      /* The artboard frame's arrival. It rests at `opacity: 0`, so WITHOUT this keyframe it
         is simply never drawn. */
      @keyframes cg-fade {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        /* Everything stops, and the scene renders its COMPLETE, DELIBERATE composition: the
           path fully drawn, all four keyframes placed, the lower third fully assembled, the
           playhead parked. Not a blank band and not a half-built frame — the finished
           artboard, held. */
        .cg-splash *,
        .cg-splash *::before,
        .cg-splash *::after {
          animation: none !important;
          transition: none !important;
        }
        .cg-splash__scene,
        .cg-splash__wordmark,
        .cg-splash__company,
        .cg-splash__tagline,
        .cg-splash__progress,
        .cg-splash__foot,
        .cg-splash__board {
          opacity: 1 !important;
          transform: none !important;
        }
        .cg-splash__rule {
          width: min(360px, 60vw);
        }
        .cg-splash__scan {
          display: none;
        }
        .cg-splash__scene .path {
          stroke-dashoffset: 0 !important;
        }
        .cg-splash__scene .kf {
          opacity: 1 !important;
          transform: rotate(45deg) !important;
        }
        .cg-splash__scene .strap,
        .cg-splash__scene .l1,
        .cg-splash__scene .l2,
        .cg-splash__scene .tick {
          opacity: 1 !important;
          transform: scaleX(1) !important;
        }
        .cg-splash__scene .bug,
        .cg-splash__scene .dot {
          opacity: 1 !important;
          transform: none !important;
        }
        .cg-splash__scene .head {
          opacity: 0.55 !important;
          transform: none !important;
        }
        .cg-splash {

    <!--
      ══ STARTUP SPLASH — THE CLOCK ════════════════════════════════════════════════
      A classic (non-module) script, so it runs BEFORE the deferred module bundle. It owns
      `t0`, because first paint is the only honest start for this clock: a clock started from
      module scope is already late by exactly the parse time this screen exists to cover.

      The arithmetic it implements is stated as a pure function in
      `src/renderer/splashTiming.ts`, over the shared rules in `@cg/splash-kit`. That
      duplication is real and it is CONTAINED rather than denied: `tests/splash.dom.test.ts`
      runs THIS script in jsdom and asserts its constants and its dismissal instant against
      that module.
    -->
    <script>
      (function () {
        var el = document.getElementById('cg-splash');
        if (!el) return;

        // The test-suite door, read FIRST. An init-script global — deliberately NOT a URL
        // query parameter, which is a door an operator can reach by bookmark or typo.
        // Set ⇒ the splash never exists: no clock, no timers, no hold.
        if (window.__CG_SPLASH_DISABLED__) {
          el.remove();
          return;
        }

        // Mirrors of `splashTiming.ts` — see this block's header.
        var COLD_FLOOR_MS = 8000;
        var WARM_FLOOR_MS = 3000;
        var CEILING_MS = 20000;
        var FADE_MS = 450;
        var TICK_MS = 100;
        var SESSION_KEY = 'CG_DESIGNER_SESSION';
        // THREE LABELS, THREE WORK STEPS, each naming the work happening NOW. There is no
        // terminal label: see `splashTiming.ts` and the `#cg-splash-phase` rule above for
        // why the label leaves on completion instead of settling on a word.
        var PHASES = ['INITIALIZING', 'OPENING STORAGE', 'STARTING INTERFACE'];

        var t0 = Date.now();

        // Cold vs warm. `sessionStorage` survives F5 in the same tab and is empty in a new
        // tab or a new browser, so its ABSENCE is the cold signal exactly — no threshold to
        // guess. A browser that refuses storage is treated as cold rather than failing boot.
        var coldStart = true;
        try {
          coldStart = window.sessionStorage.getItem(SESSION_KEY) === null;
          window.sessionStorage.setItem(SESSION_KEY, '1');
        } catch (e) {
          coldStart = true;
        }
        var floorMs = coldStart ? COLD_FLOOR_MS : WARM_FLOOR_MS;

        var fillEl = document.getElementById('cg-splash-fill');
        var phaseEl = document.getElementById('cg-splash-phase');
        var pctEl = document.getElementById('cg-splash-pct');
        var readoutEl = document.getElementById('cg-splash-readout');

        var dismissed = false;
        var bootDone = false;
        var holdTimer = null;
        var tickTimer = null;
        // Steps FINISHED. A label names the work happening NOW, so it is not complete while
        // it is showing: `completed` reaches PHASES.length at done(), never before.
        var completed = 0;
        var progress = 0;

        // The mirror of `splashProgress()` / `splashProgressPercent()`. FLOOR rather than
        // round: a screen reading 100 while the door is still shut is the same false claim as
        // a terminal READY label.
        function render() {
          var byTime = (Date.now() - t0) / floorMs;
          var bySteps = completed / PHASES.length;
          progress = Math.max(progress, Math.min(1, Math.max(0, Math.min(byTime, bySteps))));
          var pct = Math.floor(progress * 100);
          // The rail is SCALED rather than widened — same number, no layout per tick.
          if (fillEl) fillEl.style.transform = 'scaleX(' + pct / 100 + ')';
          if (pctEl) pctEl.textContent = pct + '%';
        }

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          clearTimeout(ceilingTimer);
          if (holdTimer !== null) clearTimeout(holdTimer);
          // One last reading BEFORE the ticker stops, so the rail lands on the number the
          // moment of dismissal actually earned: 100 on a completed hold, and honestly less
          // than that when the 20 s ceiling is what ended it.
          render();
          if (tickTimer !== null) clearInterval(tickTimer);
          el.setAttribute('data-dismissing', 'true');
          setTimeout(function () {
            // REMOVE it, don't just hide it: a full-screen overlay left in the DOM is a
            // click swallower waiting to be rediscovered.
            if (el.parentNode) el.parentNode.removeChild(el);
          }, FADE_MS);
        }

        function phase(key) {
          var i = PHASES.indexOf(key);
          if (i < 0 || dismissed) return;
          // Entering step `i` means the `i` steps BEFORE it are behind us. Monotone, so a
          // phase reported out of order cannot walk the readout backwards.
          if (i > completed) completed = i;
          if (phaseEl) phaseEl.textContent = key;
          render();
        }

        function done() {
          // Idempotent: the hold is scheduled from the FIRST completion signal only. React
          // StrictMode re-runs effects in development, so this is called twice as a matter
          // of course.
          if (bootDone || dismissed) return;
          bootDone = true;
          // The LAST step completes here and nowhere earlier, which is what makes 100% mean
          // "the door is about to open" rather than "the last label appeared".
          completed = PHASES.length;
          // The label LEAVES rather than settling on a word — the percentage carries the
          // rest of the hold alone. See the `#cg-splash-phase` rule for why.
          if (readoutEl) readoutEl.setAttribute('data-done', 'true');
          render();
          var now = Date.now();
          // dismissAt = min( max(t0 + floor, bootDone), t0 + ceiling )
          var dismissAt = Math.min(Math.max(t0 + floorMs, now), t0 + CEILING_MS);
          holdTimer = setTimeout(dismiss, Math.max(0, dismissAt - now));
        }

        // The CEILING is armed at t0 and never disarmed except by dismissal. A stuck splash
        // means the operator has no door into the application at all; at the ceiling it goes
        // regardless of boot state and the app's own surfaces take over.
        var ceilingTimer = setTimeout(dismiss, CEILING_MS);
        // The readout's clock half. An interval, NOT `requestAnimationFrame`: this screen
        // runs while the bundle parses and React commits, and per-frame script work would be
        // taken from the boot it exists to cover.
        tickTimer = setInterval(render, TICK_MS);

        window.__CG_SPLASH__ = { phase: phase, done: done };
        phase('INITIALIZING');
      })();
    </script>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
