[package]
name = "cg-designer"
version = "0.11.3"
description = "CG Designer: the template editor as a Windows app, with no bridge (ADR 0011)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }

# TEXT-DIGITS-01 — `keyboard_language` reads the webview input thread's keyboard layout.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
