name: PR

on:
  pull_request:
  # `dev` is where ALL work lands (see CLAUDE.md "Branching"): there are no
  # per-change branches and no PRs, so without `dev` here CI fired only on the
  # owner's end-of-day merge to `main` — always AFTER the fact. This job graph
  # already runs the full Playwright suite on ubuntu-latest, so the Linux
  # `gate:e2e` debt was never a missing capability, only a missing trigger.
  push:
    branches: [main, dev]

# B-043 — paths-filter fetches a PR's changed files via the GitHub API, which
# needs `pull-requests: read`. With no permissions block the token falls back
# to the repo default (restrictive `contents: read`), and every pull_request
# run failed with "Resource not accessible by integration" → the fail-safe
# `required` gate went red. Explicit least-privilege grant — correct under
# both restrictive and permissive defaults.
permissions:
  contents: read
  pull-requests: read
  # P-030 — the merge-run reuse guard reads this workflow's own past runs and
  # their jobs. Read-only, and the guard FAILS SAFE (runs everything) if the
  # grant is ever missing, so a permission regression costs minutes, never
  # coverage.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # P-027 — cancel PR runs, NEVER push runs.
  #
  # A cancelled run is NOT A RESULT: neither pass nor fail, `conclusion` reads
  # `cancelled`. That was tolerable while every push ran everything, because the
  # next push re-proved the same files. It is NOT tolerable now that the filter
  # below only looks at what a push changed: a code push whose run is cancelled,
  # followed by a docs-only push, would leave that code commit with NO completed
  # run at all — and CLAUDE.md discharges Linux `e2e` debts from exactly these
  # runs. The two halves therefore changed together, in one commit.
  #
  # Observed before the change: run 30761140987 on `main` was cancelled at 39s by
  # the push behind it.
  #
  # On a PR, cancelling is still right — only the head commit's verdict matters
  # and the branch is not what anyone merges from.
  #
  # RESIDUAL, stated so nobody reads more into this than it gives: with
  # cancel-in-progress false the IN-PROGRESS run always completes, but GitHub
  # keeps only ONE pending run per group, so pushing three times in quick
  # succession still supersedes the middle one while it is PENDING. Every push
  # getting its own completed run holds for the normal one-at-a-time cadence, not
  # for a burst. If a burst ever needs full coverage, the lever is a per-SHA
  # concurrency group — deliberately not taken here, because it removes the
  # serialization that keeps runner-minute spend bounded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  # P-008 — detect whether any NON-docs file changed. `code` is 'true' iff at least
  # one changed file is OUTSIDE the docs set. This is the STRICT condition, so code
  # accidentally bundled into a docs change is NOT skipped.
  #
  # P-027 — HOW that is computed differs by event, and the split is deliberate:
  #
  #  - `push` → the repo's OWN classifier, `classifyChangedSet` from
  #    `tools/gate-hook/src/gate-decision.mjs`, fed the diff against the trusted
  #    base below. It is the same predicate the Stop hook and CLAUDE.md's carve-out
  #    use, it is unit-tested, and reusing it means CI cannot drift from the local
  #    gate (CLAUDE.md golden rule 6: reuse the ONE canonical predicate, never
  #    re-derive it).
  #  - `pull_request` → dorny/paths-filter, unchanged. There is no local base for a
  #    PR, so the action's API-based diff is still the right tool there.
  #
  # Why the filter is no longer trusted on the push path: its pattern list
  #   ['**', '!openspec/**', '!docs/**', '!**/*.md']
  # was documented here as "last-match-wins picomatch". It is NOT. dorny/paths-filter
  # ORs its patterns, so `'**'` alone makes every file match and `code` could never
  # be false — measured on run 31257557820, where a push whose ONLY changed file was
  # `docs/prd/bugs.md` reported `Filter code = true` with that file listed as the
  # match. The docs-only skip had therefore never worked, independently of the base.
  # `predicate-quantifier: every` would fix the ORing, but `**` does not match
  # dot-prefixed paths, so `.github/**` and `.claude/**` would then classify as
  # docs-only and SKIP the gate — trading an over-run for an under-run, which is the
  # one direction that must never happen. The classifier has no such ambiguity.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      # P-029 — does this diff owe the authoritative Linux E2E? Separate from `code`:
      # a change can need the unit gate without being able to alter what renders.
      needs_e2e: ${{ steps.decide.outputs.needs_e2e }}
      # P-030 — this exact SHA already has a completed, successful run that RAN
      # both heavy jobs, so the heavy jobs are skipped and `required` passes
      # citing it. Only ever 'true' on a push to `main`.
      reuse: ${{ steps.reuse.outputs.reuse }}
      prior_run_url: ${{ steps.reuse.outputs.prior_run_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # paths-filter needs git history to diff push events; PRs use the API.
          fetch-depth: 0

      # P-027 — WHICH base a push is diffed against. Left to itself, paths-filter
      # takes the merge-base with the DEFAULT BRANCH: on the dev-only model that
      # is every commit since the last `dev` -> `main` merge, so `code` is `true`
      # forever once any code commit is unmerged and the P-008 skip is dead. It is
      # P-026's failure in a second tool - a base that measures the unmerged
      # BACKLOG rather than the event.
      #
      # The base is therefore the PREVIOUS TIP of the ref, so "changed files"
      # means changed BY THIS PUSH. Every case where that tip cannot be trusted
      # FAILS SAFE to the old always-run behaviour; over-running costs minutes,
      # under-running lets an unproven commit through, so the asymmetry is
      # deliberate and one-directional.
      - name: Resolve the push diff base
        id: base
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          untrusted() {
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "Push base NOT trusted: $1 - failing safe (run everything)."
          }
          if [ -z "${BEFORE:-}" ] || printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            # A brand-new ref has an all-zero `before`; there is no previous tip.
            untrusted 'no previous tip (new branch / all-zero before)'
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Shallow clone, expired object, or a rewritten ref: not diffable.
            untrusted 'previous tip is not present in the fetched history'
          elif ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            # A FORCE-PUSH rewrote the ref, so `before` sits on an abandoned line
            # of history and a diff against it is meaningless, not merely wide.
            untrusted 'previous tip is not an ancestor of HEAD (force-push / history rewrite)'
          else
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            echo "reason=previous tip of this ref" >> "$GITHUB_OUTPUT"
            echo "Push base trusted: $BEFORE (previous tip of this ref)."
          fi

      # P-027 — the push path, using the canonical classifier rather than globs.
      # `gate-decision.mjs` is zero-dependency plain ESM with no build step, so the
      # runner's preinstalled node runs it directly off the checkout.
      - name: Classify the push's changed paths
        id: push_changes
        if: github.event_name == 'push' && steps.base.outputs.trusted == 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE"..HEAD > changed-files.txt
          echo "Changed by this push ($(wc -l < changed-files.txt) files):"
          cat changed-files.txt
          cat > classify-push.mjs <<'CLASSIFY'
          import { appendFileSync, readFileSync } from 'node:fs';
          import {
            classifyChangedSet,
            parseNameOnly,
          } from './tools/gate-hook/src/gate-decision.mjs';

          const paths = parseNameOnly(readFileSync('changed-files.txt', 'utf8'));
          const classification = classifyChangedSet(paths);
          // 'code' runs the heavy gate. 'docs-only' takes the carve-out, and 'empty'
          // (a push that changes nothing) has nothing to prove.
          const code = classification.kind === 'code';
          console.log(
            `classification: kind=${classification.kind} ` +
              `needsE2e=${classification.needsE2e} files=${paths.length} => code=${code}`,
          );
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `code=${code}\nneeds_e2e=${classification.needsE2e}\n`,
          );
          CLASSIFY
          node classify-push.mjs
          rm -f classify-push.mjs changed-files.txt

      # P-030 — `dev` -> `main` is a `--ff-only` merge, so `main`'s new HEAD is the
      # SAME COMMIT as `dev`'s tip: same SHA, same tree, and a full run has usually
      # already passed on it. That second run costs ~15 metered runner-minutes a
      # day to re-prove a tree nothing changed. `[skip ci]` cannot help — a
      # fast-forward creates no commit whose message could carry it — so the
      # question is put to the Actions API instead.
      #
      # 🔴 GREEN IS NOT ENOUGH. `e2e` is gated on `needs_e2e` (P-029), so a
      # docs-only push to `dev` yields a completed, successful run in which the
      # suite never ran — and the merge run is exactly the COMPLETENESS BACKSTOP
      # for the day's render changes. The prior run must have RUN what this run
      # would need. `reuse-decision.mjs` owns that rule and is unit-tested against
      # REAL captured API responses for all three shapes (both ran / e2e skipped /
      # e2e failed); this step only fetches and reports.
      #
      # Every uncertainty — API error, missing permission, unreadable jobs, a
      # renamed job — resolves to `reuse=false`, i.e. run everything. The guard may
      # only ever skip on a positive, complete match.
      - name: Reuse a prior green run for this SHA (push to main only)
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          runs_json="$(gh api "repos/$REPO/actions/workflows/pr.yml/runs?head_sha=$HEAD_SHA&per_page=20" 2>/dev/null || echo 'null')"
          printf '%s' "$runs_json" > runs.json

          cat > reuse.mjs <<'REUSE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { decideReuse } from './tools/gate-hook/src/reuse-decision.mjs';

          let runs = null;
          try {
            runs = JSON.parse(readFileSync('runs.json', 'utf8'))?.workflow_runs ?? null;
          } catch {
            runs = null;
          }

          const jobsFor = (id) => {
            try {
              return JSON.parse(
                execFileSync('gh', ['api', `repos/${process.env.REPO}/actions/runs/${id}/jobs`], {
                  encoding: 'utf8',
                }),
              );
            } catch {
              return null;
            }
          };

          const d = decideReuse({ runs, jobsFor, currentRunId: process.env.CURRENT_RUN_ID });
          console.log(`P-030: reuse=${d.reuse} — ${d.reason}`);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `reuse=${d.reuse}\nprior_run_url=${d.priorRunUrl ?? ''}\n`,
          );
          // Constraint 5 — a merge run that is green because it did NOTHING must
          // never read the same as one that is green because it PASSED.
          writeFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            d.reuse
              ? `### P-030 — heavy jobs skipped\n\nThis commit (\`${process.env.HEAD_SHA}\`) was already verified by a completed, successful run that ran both the unit gate and the Playwright suite:\n\n**${d.priorRunUrl}**\n\n_${d.reason}_\n`
              : `### P-030 — running the full gate\n\n_${d.reason}_\n`,
            { flag: 'a' },
          );
          REUSE
          node reuse.mjs || echo 'P-030: the guard itself failed - running everything.'
          # The fail-safe, written LAST and only if nothing wrote the key — so the
          # value never depends on duplicate-key precedence in $GITHUB_OUTPUT. If
          # the node step died before reporting, this is what the job reads.
          if ! grep -q '^reuse=' "$GITHUB_OUTPUT" 2>/dev/null; then
            echo 'P-030: the guard produced no verdict - running everything.'
            printf 'reuse=false\nprior_run_url=\n' >> "$GITHUB_OUTPUT"
          fi
          rm -f reuse.mjs runs.json

      - name: Filter changed paths
        id: filter
        # `pull_request` only — the push path is classified above. Left exactly as it
        # was, per the standing instruction not to touch the PR path: paths-filter
        # uses the GitHub API for a PR, where no local base exists.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**'
              - '!openspec/**'
              - '!docs/**'
              - '!**/*.md'

      # The single place `code` is decided, so every fail-safe funnels through one
      # rule instead of being spread across `if:` conditions on the heavy jobs.
      - name: Decide whether the heavy gate runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          TRUSTED: ${{ steps.base.outputs.trusted }}
          REASON: ${{ steps.base.outputs.reason }}
          PUSH_CODE: ${{ steps.push_changes.outputs.code }}
          PUSH_E2E: ${{ steps.push_changes.outputs.needs_e2e }}
          FILTERED: ${{ steps.filter.outputs.code }}
        run: |
          set -uo pipefail
          # P-029 — `needs_e2e` decides whether the AUTHORITATIVE suite runs, so every
          # path that is not a definite 'false' from the classifier resolves to TRUE.
          # `pull_request` has no classifier (paths-filter computes only `code`), so PRs
          # always run the E2E, exactly as before.
          needs_e2e='true'
          if [ "$EVENT" = 'push' ] && [ "${TRUSTED:-}" = 'true' ] && [ "${PUSH_E2E:-}" = 'false' ]; then
            needs_e2e='false'
          fi
          echo "needs_e2e=$needs_e2e" >> "$GITHUB_OUTPUT"
          echo "needs_e2e=$needs_e2e"

          if [ "$EVENT" = 'push' ]; then
            if [ "${TRUSTED:-}" != 'true' ]; then
              echo "code=true  (FAIL-SAFE: untrusted base - ${REASON:-unknown})"
              echo 'code=true' >> "$GITHUB_OUTPUT"
            elif [ -z "${PUSH_CODE:-}" ]; then
              # The classifier did not report. Unknown must mean "run it".
              echo 'code=true  (FAIL-SAFE: the push classifier produced no verdict)'
              echo 'code=true' >> "$GITHUB_OUTPUT"
            else
              echo "code=$PUSH_CODE  (classifier, base=${REASON:-n/a})"
              echo "code=$PUSH_CODE" >> "$GITHUB_OUTPUT"
            fi
          elif [ -z "${FILTERED:-}" ]; then
            echo 'code=true  (FAIL-SAFE: the paths filter produced no verdict)'
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo "code=$FILTERED  (paths-filter, GitHub API base)"
            echo "code=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Lint • Typecheck • Test • Build
    # P-008 — heavy gate runs only when a non-docs file changed (skips docs-only).
    needs: changes
    # P-030 — and skip when this exact SHA already has a completed run that RAN
    # this job. Only ever true on a push to `main`; see the `reuse` step.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    # Browser SPAs build + test cross-platform; no Electron means no Windows
    # requirement, so CI runs on Linux (faster + cheaper).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        # Must come before setup-node so setup-node's pnpm cache works.
        # Version is read from package.json's `packageManager` field.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E runs in its OWN job (P-005) so it never slows the fast unit gate above.
  # Required green. The Designer boots in test mode (window.CG_E2E → MemoryWorkspace,
  # no native dialogs); Playwright serves the built app via `vite preview`.
  e2e:
    name: E2E (Playwright)
    # P-008 — skip on docs-only, same as the unit gate.
    # P-029 — AND skip when the diff cannot change what renders. `needs_e2e` comes from
    # the repo's own `classifyChangedSet`, whose render set is derived from the two apps'
    # runtime dependency closure and whose default for an UNRECOGNISED path is `true`, so
    # this can only skip a diff that is positively known to be render-safe.
    needs: changes
    # P-030 — and skip when this exact SHA already has a completed run that RAN it.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.needs_e2e == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser download keyed on the installed version, so
      # Chromium isn't re-downloaded on every run.
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/designer
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (+ deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cg/designer exec playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @cg/designer exec playwright install-deps chromium

      - name: Build (workspace)
        run: pnpm build

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/designer/playwright-report/
          retention-days: 7

  # P-008 — the LIGHT docs gate. Cheap; runs every PR (it's the only required work
  # on a docs-only PR, and a useful spec/format sanity check on code PRs too).
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenSpec validate
        run: pnpm openspec validate --all --strict

      - name: Format check
        run: pnpm format:check

  # P-008 — the SINGLE required status check. Always runs and itself decides
  # pass/fail, so a heavy job that was SKIPPED on a docs-only PR can't leave a
  # required check pending and block merge. Branch protection should require THIS
  # job (`required`) and drop the direct requirements on `ci` / `e2e`.
  required:
    name: required
    needs: [changes, ci, e2e, docs-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Aggregate results
        run: |
          code='${{ needs.changes.outputs.code }}'
          needs_e2e='${{ needs.changes.outputs.needs_e2e }}'
          reuse='${{ needs.changes.outputs.reuse }}'
          prior='${{ needs.changes.outputs.prior_run_url }}'
          ci='${{ needs.ci.result }}'
          e2e='${{ needs.e2e.result }}'
          docs='${{ needs.docs-check.result }}'
          echo "code=$code | needs_e2e=$needs_e2e | reuse=$reuse | ci=$ci | e2e=$e2e | docs-check=$docs"
          # P-030 — the SAME SHA already has a completed run that RAN both heavy
          # jobs, so this run deliberately did not repeat them. This is a THIRD
          # kind of skip, distinct from P-008's docs-only and P-029's not-owed,
          # and it is only ever reachable on a push to `main`.
          #
          # It is reported with the prior run's URL because a merge run that is
          # green because it did NOTHING must never read the same as one that is
          # green because it PASSED — a human needs to see what verified it.
          if [ "$reuse" = 'true' ]; then
            echo "Already verified by a completed, successful run of this workflow for this SHA:"
            echo "  $prior"
            {
              echo '### required — OK (verified by a prior run)'
              echo ''
              echo "This commit was verified by **$prior**, which ran both the unit gate and the Playwright suite. The heavy jobs were not repeated (P-030)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" = 'false' ]; then
            if [ "$docs" = 'success' ]; then
              echo 'Docs-only change: docs-check passed → required OK.'
              exit 0
            fi
            echo 'Docs-only change: docs-check did not pass → required FAIL.'
            exit 1
          fi
          if [ "$ci" != 'success' ]; then
            echo 'Code change: ci did not pass → required FAIL.'
            exit 1
          fi
          # P-029 — a DELIBERATELY skipped e2e is a pass; a skipped e2e that was OWED is
          # not. The `needs_e2e = false` test is what separates them, so a job that fails
          # to start still reddens this gate.
          if [ "$e2e" = 'success' ]; then
            echo 'Code change: ci + e2e passed → required OK.'
            exit 0
          fi
          if [ "$e2e" = 'skipped' ] && [ "$needs_e2e" = 'false' ]; then
            echo 'Code change with no render surface: ci passed, e2e not owed → required OK.'
            exit 0
          fi
          echo 'Code change: e2e was owed and did not pass → required FAIL.'
          exit 1
