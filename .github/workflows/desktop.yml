# WIP — `SIGNIN-ESCAPE-01` reproduction on the UNFIXED 0.11.4: only the two jobs it needs. Never merged.
name: Desktop

# DESKTOP-APPS-01 — the Windows installers (ADR 0011). CENTRAL-BRIDGE-01 made them three: CG Bridge
# (the service on the Playout machine, per machine), CG Control (a console that connects to it, per
# user, no bridge of its own) and CG Designer (on its own). Built here, on windows-latest, so nobody
# needs Rust locally; then installed and driven on fresh runners that have built nothing.
#
# A separate workflow from `pr.yml`: that file's jobs, its `required` aggregation and the
# P-030 reuse guard are keyed to their job names and are untouched. This one is the record of
# the installers — its artifacts are what the owner downloads.
#
# CLIENT-TEST-RELEASE-01 B4 — a tag `v<version>` runs the same jobs from the tagged commit, and
# then `release` opens a DRAFT pre-release holding exactly the three installers, SHA256SUMS.txt and
# the Persian install guide. CI never publishes it: the owner does, or hands the files over.

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    # A release tag. GitHub does not evaluate path filters for a tag push, so every tag runs.
    tags: ['v*']
    # A docs-only push cannot change what the installers contain.
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Push runs are never cancelled (P-027's reasoning): a cancelled run is not a result.
  cancel-in-progress: false

jobs:
  installers:
    name: Installers (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # CLIENT-TEST-RELEASE-01 B1 — ONE version for CG Control, CG Designer and the bridge, read
      # from every file that carries it; a build whose files disagree stops here, before anything
      # is built. On a tag (B4), a tag that does not name that version stops it too. Zero-dependency,
      # so the runner's own Node runs it.
      - name: The release version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = @()
          if ($env:REF_TYPE -eq 'tag') { $tag = @('--tag', $env:REF_NAME) }
          $version = node tools/release/src/release-version.mjs @tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Release version: $version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # The Node installed here is also the one the CG Bridge installer ships: its staging step
      # copies this official node.exe as the service's `cg-bridge.exe`.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        run: pnpm build

      # CENTRAL-BRIDGE-01 1C — CG Control's shell: its native Playout sign-in (no Origin, http only)
      # and its one read-only keyboard command, tested before the app is built from it.
      - name: Test CG Control's shell (Rust)
        run: cargo test --release -p cg-control

      # CENTRAL-BRIDGE-01 1A (D1) — Shawl 1.9.0 (MIT), the service host CG Bridge runs under, built
      # here from crates.io; the installer carries it, so nothing is fetched at install time.
      - name: Build Shawl (the service host)
        run: cargo install shawl --version 1.9.0 --locked

      - name: Stage CG Bridge's payload (bridge bundle, node.exe, shawl.exe)
        shell: pwsh
        run: node tools/caspar-bridge/scripts/stage-bridge.mjs --shawl "$env:USERPROFILE\.cargo\bin\shawl.exe"

      # CLIENT-TEST-RELEASE-01 — the installers carry no real address and no test secret: every text
      # file the installers are built from, scanned before any is built. CG Control bundles its
      # console (apps/runtime/dist) the way CG Designer bundles its page.
      - name: Scan what the installers ship
        run: node tools/release/src/scan-payload.mjs apps/runtime/dist apps/designer/dist tools/bridge-installer/payload

      # CENTRAL-BRIDGE-01 1A — CG Bridge's own NSIS installer (per machine; the service CGBridge). The
      # runner's NSIS when it has one; else NSIS from Chocolatey (build time only).
      - name: Build CG Bridge
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          & $makensis /V2 "/DVERSION=$env:VERSION" tools/bridge-installer/cg-bridge.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "tools/bridge-installer/CG-Bridge_${env:VERSION}_x64-setup.exe" | Format-List Name, Length

      - name: Build CG Control
        run: pnpm --filter @cg/runtime tauri build

      - name: Build CG Designer
        run: pnpm --filter @cg/designer tauri build

      # INSTALLER-DESIGN-01 (P-063) — CG Setup, the setup window every installer opens. The three
      # installers built above become its ENGINES, unchanged: CG Setup goes in front of each, and with
      # /S it hands the command line to the engine and returns the engine's exit code. 32-bit, as the
      # NSIS installers are, so an installer still starts on 32-bit Windows and refuses there with
      # exit 2 as before. Its unit tests (the NSIS-exact command line, the progress steps keyed to
      # cg-bridge.nsi's log labels, the palette read from theme.ts) run first.
      - name: Test CG Setup
        run: cargo test -p cg-setup

      - name: Build CG Setup (32-bit)
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release -p cg-setup --target i686-pc-windows-msvc

      # P-067 (RELEASE-0114-01 Part B2) — every page of all three setup windows, rendered by the
      # program just built, before anything is packed: the bare cg-setup.exe (nothing appended) offers
      # only its developer preview (`--cg-preview`, src/dev.rs), which paints each page through the
      # window's own painter onto a bitmap — at 100 %, and Welcome at 150 % and 200 %. The record of
      # each installer's step rail and the art at its foot. A GUI-subsystem program, so it is waited for.
      - name: Render CG Setup's pages (each rail's art)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/i686-pc-windows-msvc/release/cg-setup.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--cg-preview', 'setup-rail-art', 'apps/runtime/src-tauri/icons/icon.png', 'apps/designer/src-tauri/icons/icon.png')
          if ($p.ExitCode -ne 0) { "The preview exited $($p.ExitCode)."; exit 1 }
          foreach ($role in 'control', 'designer', 'bridge') {
            if (-not (Test-Path "setup-rail-art/$role-welcome.png")) { "No $role-welcome.png."; exit 1 }
          }
          Get-ChildItem setup-rail-art | Format-Table Name, Length -AutoSize

      - name: Upload CG Setup's pages
        uses: actions/upload-artifact@v7
        with:
          name: setup-rail-art
          path: setup-rail-art/
          if-no-files-found: error
          retention-days: 30

      # The install guide the window's Help opens, when this release has one (the release job prints
      # the same file again for the release itself).
      - name: Build the install guide for the installers' Help
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $md = "docs/release/$env:VERSION/install-guide.fa.md"
          if (Test-Path $md) {
            node tools/release/src/build-guide.mjs $md --out guide/install-guide.pdf
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            "No install guide for $env:VERSION: the installers carry none, and their Help is not shown."
          }

      # Each installer: CG Setup + the product's icon and version + its engine appended. The sizes of
      # each engine and each installer go to the log (the report compares them).
      - name: Pack the installers (CG Setup in front of each engine)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $guide = @()
          if (Test-Path guide/install-guide.pdf) { $guide = @('--guide', 'guide/install-guide.pdf') }
          node tools/release/src/pack-installers.mjs $env:VERSION --setup target/i686-pc-windows-msvc/release --out installers @guide
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # P-060 — the hashes go to the LOG only. This job used to write installers/SHA256SUMS.txt over
      # Tauri's built names (with a space) and ship it inside both artifacts; the owner took that for
      # the release's. The release's own SHA256SUMS.txt (release-files.mjs) is the only file of that name.
      # INSTALLER-DESIGN-01 — the engines are kept too: the smokes run every silent path against the
      # engine alone AND the installer, and require the same exit codes.
      - name: Collect the installers, and their engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force engines | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe engines/
          Copy-Item tools/bridge-installer/CG-Bridge_*_x64-setup.exe engines/
          Get-ChildItem installers, engines | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Directory.Name)/$($_.Name)  $($_.Length) bytes"
          }

      # RELEASE-0110-01 §3 — and what the BUILT installers carry, not only what they are built from:
      # each engine opened with 7-Zip and every text file in it scanned — no private address, no test
      # secret, no token, no dev-only code (the dev station's flags, the suite's fakes) — and every
      # program WE build read for its strings: CG Setup's front end, and each app's own exe. A Tauri app
      # embeds its page compressed inside its exe; that page is `apps/*/dist`, scanned above before it
      # was built in, so the exe's strings are its shell's. Third-party programs (Node as
      # `cg-bridge.exe`, shawl, NSIS plug-ins, the WebView2 installer) are listed, never read: their own
      # documentation carries example private addresses (Node's `BlockList` docs: `192.168.1.0/24`).
      - name: Scan the built installers
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          $dirs = @()
          foreach ($engine in Get-ChildItem engines -Filter '*-setup.exe') {
            $to = Join-Path 'installer-contents' ($engine.BaseName -replace '\s', '-')
            & $sevenZip x $engine.FullName "-o$to" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { "7-Zip could not open $($engine.Name)"; exit 1 }
            $root = (Resolve-Path $to).Path
            "$($engine.Name): $((Get-ChildItem $to -Recurse -File).Count) files"
            Get-ChildItem $to -Recurse -File | ForEach-Object { "  $($_.Length)  $($_.FullName.Substring($root.Length + 1))" }
            $dirs += $to
          }
          # Each app's own exe, found in its engine — one, and not empty: a scan of nothing proves nothing.
          $ours = @('target/i686-pc-windows-msvc/release/cg-setup.exe')
          foreach ($app in 'cg-control.exe', 'cg-designer.exe') {
            $found = @(Get-ChildItem installer-contents -Recurse -File -Filter $app)
            if ($found.Count -ne 1 -or $found[0].Length -eq 0) { "Expected one non-empty $app in the engines; found $($found.Count)."; exit 1 }
            $ours += $found[0].FullName
          }
          node tools/release/src/scan-payload.mjs @dirs --binaries ($ours -join ',')
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload CG Control
        uses: actions/upload-artifact@v7
        with:
          name: CG-Control-installer
          path: installers/CG Control_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload CG Designer
        uses: actions/upload-artifact@v7
        with:
          name: CG-Designer-installer
          path: installers/CG Designer_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload CG Bridge
        uses: actions/upload-artifact@v7
        with:
          name: CG-Bridge-installer
          path: installers/CG-Bridge_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      # Not a deliverable: the three engines, for the smokes' engine-vs-installer exit codes.
      - name: Upload the engines (for the smokes)
        uses: actions/upload-artifact@v7
        with:
          name: installer-engines
          path: engines/
          if-no-files-found: error
          retention-days: 14

  # CENTRAL-BRIDGE-01 1E — CG Bridge on a clean Windows, as the Playout's installer will chain it:
  # silent install, the service (automatic, recovery, no dependency), /health under a second, our
  # rules, nothing on UDP 6250, no state for a console without a token, a stop that stays stopped
  # and a crash that Windows restarts, a silent upgrade and a silent uninstall, each exit code
  # read. Its own runner: its stop, crash, upgrade and uninstall take away the very service the
  # app smoke's CG Control is connected to.
  acceptance-fresh:
    name: Release acceptance — fresh install, offline (clean Windows)
    needs: installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 24 (the fakes run by type stripping)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CasparCG's stand-in
        run: pnpm --filter @cg/amcp-mock build

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: CG-*-installer
          path: installers
          merge-multiple: true

      # ONE step on purpose: the fake station must live from the first phase to the last, and the runner
      # ends what a step started when the step ends (run 37186619456: the station was gone by the next
      # step). The elevated phases run here; the drive runs at medium integrity through gsudo, because
      # WebView2 opens DevTools only in an unelevated process (see the smoke job). Every phase runs;
      # the summary decides.
      - name: Install offline in the guide's order, drive CG Control end to end, uninstall
        shell: pwsh
        run: |
          winget install --id gerardog.gsudo --exact --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:Path += ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $gsudo = (Get-Command gsudo -ErrorAction Stop).Source
          $node = (Get-Command node -ErrorAction Stop).Source
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          $v = '${{ needs.installers.outputs.version }}'
          $acceptance = 'apps/runtime/tests/desktop/release-acceptance.mjs'
          New-Item -ItemType Directory -Force acceptance | Out-Null
          $station = Start-Process $node -ArgumentList 'apps/runtime/tests/desktop/acceptance-station.mjs', '--out', 'acceptance' -PassThru -RedirectStandardOutput acceptance/station.out.txt -RedirectStandardError acceptance/station.err.txt -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path acceptance/station.json) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path acceptance/station.json)) { Get-Content acceptance/station.err.txt; exit 1 }
          Get-Content acceptance/station.json
          $bridge = (Get-ChildItem installers -Filter 'CG-Bridge_*-setup.exe').FullName
          $control = (Get-ChildItem installers -Filter 'CG Control_*-setup.exe').FullName
          $designer = (Get-ChildItem installers -Filter 'CG Designer_*-setup.exe').FullName
          "::group::install (elevated, the network cut)"
          & $node $acceptance --phase install --bridge "$bridge" --control "$control" --designer "$designer" --version $v --out acceptance
          "::endgroup::"
          "::group::drive (medium integrity)"
          & $gsudo --integrity Medium $node $acceptance --phase drive --mode fresh --version $v --out acceptance
          "::endgroup::"
          "::group::stuck-station (medium integrity) - B-320, the owner's stuck console"
          & $gsudo --integrity Medium $node $acceptance --phase stuck-station --version $v --out acceptance
          "::endgroup::"
          "::group::uninstall (elevated)"
          & $node $acceptance --phase uninstall --version $v --out acceptance
          "::endgroup::"
          "station alive at the end: $(-not $station.HasExited)"
          & $node $acceptance --phase summary --expect install,drive,stuck-station,uninstall --out acceptance
          $code = $LASTEXITCODE
          Stop-Process -Id $station.Id -Force -ErrorAction SilentlyContinue
          exit $code

      - name: Upload the acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-fresh
          path: acceptance/
          retention-days: 30

  # RELEASE-0110-01 §3 — THE REAL UPGRADE: the classic NSIS `0.10.0` the owner holds, from the `v0.10.0`
  # draft's own installers, a take left ON AIR through it, then each `0.11.0` installer over it — its
  # Welcome ("Update from 0.10.0 to …"), then `/S` — and CG Bridge's service, configuration and session,
  # CG Control's station and the row ON AIR all kept, with no `CLEAR` reaching CasparCG's stand-in.