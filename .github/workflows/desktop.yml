          merge-multiple: true

      - name: The 0.11.3 installers, from the v0.11.3 draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.11.3 --pattern 'CG-*_0.11.3_x64-setup.exe' --dir previous
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem previous | Format-Table Name, Length

      # ONE step, for the reason the fresh job gives.
      - name: The 0.11.3 set up with a row ON AIR, each installer upgraded (the apps open), the upgraded console
        shell: pwsh
        run: |
          winget install --id gerardog.gsudo --exact --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:Path += ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $gsudo = (Get-Command gsudo -ErrorAction Stop).Source
          $node = (Get-Command node -ErrorAction Stop).Source
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          $v = '${{ needs.installers.outputs.version }}'
          $acceptance = 'apps/runtime/tests/desktop/release-acceptance.mjs'
          New-Item -ItemType Directory -Force acceptance | Out-Null
          $station = Start-Process $node -ArgumentList 'apps/runtime/tests/desktop/acceptance-station.mjs', '--out', 'acceptance' -PassThru -RedirectStandardOutput acceptance/station.out.txt -RedirectStandardError acceptance/station.err.txt -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path acceptance/station.json) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path acceptance/station.json)) { Get-Content acceptance/station.err.txt; exit 1 }
          Get-Content acceptance/station.json
          $old = @{ bridge = (Resolve-Path previous/CG-Bridge_0.11.3_x64-setup.exe).Path; control = (Resolve-Path previous/CG-Control_0.11.3_x64-setup.exe).Path; designer = (Resolve-Path previous/CG-Designer_0.11.3_x64-setup.exe).Path }
          $bridge = (Get-ChildItem installers -Filter 'CG-Bridge_*-setup.exe').FullName
          $control = (Get-ChildItem installers -Filter 'CG Control_*-setup.exe').FullName
          $designer = (Get-ChildItem installers -Filter 'CG Designer_*-setup.exe').FullName
          "::group::install-classic 0.11.3 (elevated)"
          & $node $acceptance --phase install-classic --from 0.11.3 --bridge $old.bridge --control $old.control --designer $old.designer --version $v --out acceptance
          "::endgroup::"
          "::group::drive the 0.11.3 console, a row ON AIR (medium integrity)"
          & $gsudo --integrity Medium $node $acceptance --phase drive --mode classic --from 0.11.3 --version $v --out acceptance
          "::endgroup::"
          "::group::upgrade CG Bridge; read every Welcome (elevated)"
          & $node $acceptance --phase upgrade --apps-open yes --from 0.11.3 --bridge "$bridge" --control "$control" --designer "$designer" --version $v --out acceptance
          "::endgroup::"
          "::group::upgrade CG Control and CG Designer over the two apps OPEN (medium integrity)"
          # Names without a space, for gsudo (it splits a quoted path at its space — measured on this job).
          Copy-Item $control installers\cg-control-setup.exe
          Copy-Item $designer installers\cg-designer-setup.exe
          $controlNs = (Resolve-Path installers\cg-control-setup.exe).Path
          $designerNs = (Resolve-Path installers\cg-designer-setup.exe).Path
          & $gsudo --integrity Medium $node $acceptance --phase upgrade-apps-open --from 0.11.3 --control $controlNs --designer $designerNs --version $v --out acceptance
          "::endgroup::"
          "::group::drive the upgraded console (medium integrity)"
          & $gsudo --integrity Medium $node $acceptance --phase drive-upgraded --from 0.11.3 --version $v --out acceptance
          "::endgroup::"
          "station alive at the end: $(-not $station.HasExited)"
          & $node $acceptance --phase summary --expect install-classic,drive,upgrade,upgrade-apps-open,drive-upgraded --out acceptance
          $code = $LASTEXITCODE
          Stop-Process -Id $station.Id -Force -ErrorAction SilentlyContinue
          exit $code

      - name: Upload the acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-upgrade-0113
          path: acceptance/
          retention-days: 30

  # RELEASE-0110-01 §2 — THE INSTALL GUIDE'S PICTURES OF CG CONTROL AND CG DESIGNER, from the built
  # consoles on Windows (the client's fonts and rendering), by the two `guide-shots.spec.ts` harnesses
  # (`CG_GUIDE_SHOTS`). By hand only (`gh workflow run Desktop --ref dev`): a push never pays for it.
  # The PNGs are an artifact; the release's author commits them into `docs/release/<version>/img/`.
  # A runner rather than a developer's machine because the second harness binds a CasparCG stand-in on
  # TCP 5250, which the owner's machine — also a station — may have its own CG Bridge dialling. The
  # installers' own pages are pictured by `setup-window`. No real address, token or password in any
  # picture: a documentation address is typed (RFC 5737) and the password is masked by its field.
  # Also on a push whose head commit asks for it (`[guide-shots]` in its message): a dispatch queued
  # behind a push run is replaced by the next push (one pending run per concurrency group).
  guide-shots:
    name: Guide screenshots (on request)
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[guide-shots]') }}
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pictures are of the BUILT consoles (Playwright's staleness guard refuses anything else).
      - name: Build (workspace)
        run: pnpm build

      - name: CG Control's and CG Designer's pictures (the runner's Chrome)
        shell: pwsh
        env:
          CG_GUIDE_SHOTS: ${{ github.workspace }}\guide-shots
          PW_CHANNEL: chrome
        run: |
          pnpm --filter @cg/runtime exec playwright test tests/e2e/guide-shots.spec.ts --reporter=list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pnpm --filter @cg/designer exec playwright test tests/e2e/guide-shots.spec.ts --reporter=list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem guide-shots | Format-Table Name, Length

      - name: Upload the pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: guide-shots
          path: guide-shots/
          retention-days: 30

  # CLIENT-TEST-RELEASE-01 B4 — ON A TAG ONLY, and only once the installers are built from the
  # tagged commit and BOTH clean-Windows smokes have passed (the apps', and CG Bridge's own): a DRAFT
  # pre-release with exactly five files (CENTRAL-BRIDGE-01: CG Bridge's installer joined the two).
  # INSTALLER-DESIGN-01 — and the setup window's own job, on both Windows images.
  # Never published here.
  # RELEASE-0110-01 §3 — and both release acceptances: a fresh install offline, driven end to end, and
  # the real upgrade from 0.10.0.
  # RELEASE-0112-01 Part D — and the real upgrades from 0.11.0 and from 0.11.1.
  # RELEASE-0113-01 Part E — and the real upgrade from 0.11.2.
  # RELEASE-0114-01 Part D — and the real upgrade from 0.11.3, the two apps open through it (delta C).
  release:
    name: Draft release (tag only)
    if: ${{ github.ref_type == 'tag' }}
    needs:
      [
        installers,
        smoke,
        bridge-smoke,
        setup-window,
        acceptance-fresh,
        acceptance-upgrade,
        acceptance-upgrade-0110,
        acceptance-upgrade-0111,
        acceptance-upgrade-0112,
        acceptance-upgrade-0113,
      ]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # For Playwright, which prints the guide with the runner's installed Chrome (nothing fetched).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: CG-*-installer
          path: installers
          merge-multiple: true

      - name: Build the Persian install guide (PDF)
        shell: pwsh
        env:
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          node tools/release/src/build-guide.mjs "docs/release/$env:VERSION/install-guide.fa.md" --out guide/install-guide.pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Exactly five files (tools/release/src/release-files.mjs): the three installers under names with
      # no space (GitHub would rewrite one, and SHA256SUMS.txt would name a file nobody downloads), the
      # guide, and SHA256SUMS.txt over the other four in sha256sum's own format.
      - name: Assemble the release's five files
        shell: pwsh
        env:
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          node tools/release/src/release-files.mjs assemble $env:VERSION installers guide/install-guide.pdf release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Open the DRAFT pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          # RELEASE-0110-01 — `0.11.0` is the build the client receives: titled as the release itself.
          $notes = @(
            "APASAI CG $env:VERSION. DRAFT: published by hand, never by CI.",
            '',
            '- CG Bridge installer - install it FIRST: per machine, the Windows service every CG Control connects to, on the Playout machine or on a server beside it. It opens TCP 5280 and 7911 and UDP 6251-6252 for itself only.',
            '- CG Control installer (per user; no administrator; no bridge of its own - it connects to CG Bridge).',
            '- CG Designer installer (per user; no administrator).',
            '- SHA256SUMS.txt - the SHA-256 of the other four files.',
            '- The Persian install guide (PDF).',
            '',
            'Unsigned: Windows SmartScreen warns before installing - the guide says what to press.'
          ) -join "`n"
          $files = (Get-ChildItem release -File).FullName
          gh release create $env:TAG --draft --prerelease --verify-tag --title "APASAI CG $env:VERSION" --notes $notes @files
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Read back, never trust the exit code (CLAUDE.md "Verify before claiming"): a draft, a
      # pre-release, and exactly these five assets.
      - name: Read the draft back
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          $release = gh release view $env:TAG --json isDraft,isPrerelease,assets,url | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @(node tools/release/src/release-files.mjs expect $env:VERSION | Sort-Object)
          "draft=$($release.isDraft) prerelease=$($release.isPrerelease) url=$($release.url)"
          $release.assets | ForEach-Object { "{0,12}  {1}" -f $_.size, $_.name }
          if (-not $release.isDraft -or -not $release.isPrerelease) { throw 'the release is not a draft pre-release' }
          if (($names -join '|') -ne ($expected -join '|')) { throw "assets are [$($names -join ', ')], not [$($expected -join ', ')]" }

      # P-060 — SHA256SUMS.txt against what was UPLOADED, never the local copy: every line names an asset
      # of the release exactly, every asset but the sums has a line, and each hash is the file's as
      # GitHub serves it (and GitHub's own digest of it, when it reports one). A wrong name stops here.
      - name: Check SHA256SUMS.txt against the uploaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download $env:TAG --dir uploaded
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release view $env:TAG --json assets | Out-File -Encoding utf8 uploaded-assets.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/release/src/release-files.mjs verify uploaded --assets uploaded-assets.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
