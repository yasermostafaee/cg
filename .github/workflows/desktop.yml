name: Desktop

# DESKTOP-APPS-01 — the Windows installers (ADR 0011). CENTRAL-BRIDGE-01 made them three: CG Bridge
# (the service on the Playout machine, per machine), CG Control (a console that connects to it, per
# user, no bridge of its own) and CG Designer (on its own). Built here, on windows-latest, so nobody
# needs Rust locally; then installed and driven on fresh runners that have built nothing.
#
# A separate workflow from `pr.yml`: that file's jobs, its `required` aggregation and the
# P-030 reuse guard are keyed to their job names and are untouched. This one is the record of
# the installers — its artifacts are what the owner downloads.
#
# CLIENT-TEST-RELEASE-01 B4 — a tag `v<version>` runs the same jobs from the tagged commit, and
# then `release` opens a DRAFT pre-release holding exactly the three installers, SHA256SUMS.txt and
# the Persian install guide. CI never publishes it: the owner does, or hands the files over.

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    # A release tag. GitHub does not evaluate path filters for a tag push, so every tag runs.
    tags: ['v*']
    # A docs-only push cannot change what the installers contain.
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Push runs are never cancelled (P-027's reasoning): a cancelled run is not a result.
  cancel-in-progress: false

jobs:
  installers:
    name: Installers (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # CLIENT-TEST-RELEASE-01 B1 — ONE version for CG Control, CG Designer and the bridge, read
      # from every file that carries it; a build whose files disagree stops here, before anything
      # is built. On a tag (B4), a tag that does not name that version stops it too. Zero-dependency,
      # so the runner's own Node runs it.
      - name: The release version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = @()
          if ($env:REF_TYPE -eq 'tag') { $tag = @('--tag', $env:REF_NAME) }
          $version = node tools/release/src/release-version.mjs @tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Release version: $version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # The Node installed here is also the one the CG Bridge installer ships: its staging step
      # copies this official node.exe as the service's `cg-bridge.exe`.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        run: pnpm build

      # CENTRAL-BRIDGE-01 1C — CG Control's shell: its native Playout sign-in (no Origin, http only)
      # and its one read-only keyboard command, tested before the app is built from it.
      - name: Test CG Control's shell (Rust)
        run: cargo test --release -p cg-control

      # CENTRAL-BRIDGE-01 1A (D1) — Shawl 1.9.0 (MIT), the service host CG Bridge runs under, built
      # here from crates.io; the installer carries it, so nothing is fetched at install time.
      - name: Build Shawl (the service host)
        run: cargo install shawl --version 1.9.0 --locked

      - name: Stage CG Bridge's payload (bridge bundle, node.exe, shawl.exe)
        shell: pwsh
        run: node tools/caspar-bridge/scripts/stage-bridge.mjs --shawl "$env:USERPROFILE\.cargo\bin\shawl.exe"

      # CLIENT-TEST-RELEASE-01 — the installers carry no real address and no test secret: every text
      # file the installers are built from, scanned before any is built. CG Control bundles its
      # console (apps/runtime/dist) the way CG Designer bundles its page.
      - name: Scan what the installers ship
        run: node tools/release/src/scan-payload.mjs apps/runtime/dist apps/designer/dist tools/bridge-installer/payload

      # CENTRAL-BRIDGE-01 1A — CG Bridge's own NSIS installer (per machine; the service CGBridge). The
      # runner's NSIS when it has one; else NSIS from Chocolatey (build time only).
      - name: Build CG Bridge
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          & $makensis /V2 "/DVERSION=$env:VERSION" tools/bridge-installer/cg-bridge.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "tools/bridge-installer/CG-Bridge_${env:VERSION}_x64-setup.exe" | Format-List Name, Length

      - name: Build CG Control
        run: pnpm --filter @cg/runtime tauri build

      - name: Build CG Designer
        run: pnpm --filter @cg/designer tauri build

      # P-060 — the hashes go to the LOG only. This job used to write installers/SHA256SUMS.txt over
      # Tauri's built names (with a space) and ship it inside both artifacts; the owner took that for
      # the release's. The release's own SHA256SUMS.txt (release-files.mjs) is the only file of that name.
      - name: Collect the installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installers | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe installers/
          Copy-Item tools/bridge-installer/CG-Bridge_*_x64-setup.exe installers/
          Get-ChildItem installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }

      - name: Upload CG Control
        uses: actions/upload-artifact@v7
        with:
          name: CG-Control-installer
          path: installers/CG Control_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload CG Designer
        uses: actions/upload-artifact@v7
        with:
          name: CG-Designer-installer
          path: installers/CG Designer_*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload CG Bridge
        uses: actions/upload-artifact@v7
        with:
          name: CG-Bridge-installer
          path: installers/CG-Bridge_*-setup.exe
          if-no-files-found: error
          retention-days: 30

  # CENTRAL-BRIDGE-01 1E — CG Bridge on a clean Windows, as the Playout's installer will chain it:
  # silent install, the service (automatic, recovery, no dependency), /health under a second, our
  # rules, nothing on UDP 6250, no state for a console without a token, a stop that stays stopped
  # and a crash that Windows restarts, a silent upgrade and a silent uninstall, each exit code
  # read. Its own runner: its stop, crash, upgrade and uninstall take away the very service the
  # app smoke's CG Control is connected to.
  bridge-smoke:
    name: CG Bridge smoke (clean Windows)
    needs: installers
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # The smoke, and the firewall judge both smokes share (CLIENT-TEST-RELEASE-01 B2).
          sparse-checkout: |
            tools/bridge-installer/smoke.mjs
            apps/runtime/tests/desktop/firewall-rule.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node (test harness only)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the CG Bridge installer
        uses: actions/download-artifact@v8
        with:
          name: CG-Bridge-installer
          path: installers

      - name: Install, check, upgrade and uninstall CG Bridge (elevated)
        shell: pwsh
        run: |
          $bridge = (Get-ChildItem installers -Filter 'CG-Bridge_*-setup.exe').FullName
          node tools/bridge-installer/smoke.mjs --installer "$bridge" --version "${{ needs.installers.outputs.version }}" --out bridge-smoke
          exit $LASTEXITCODE

      - name: Upload the CG Bridge smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bridge-smoke
          path: bridge-smoke/
          retention-days: 14

  smoke:
    name: Installer smoke (clean Windows)
    needs: installers
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Only the smoke script is needed; nothing is installed or built from the checkout. The two
      # tauri.conf.json files are read for each app's identifier alone (RELEASE-091-01 §3: the
      # AppUserModelID each shortcut must carry), never a second copy in the script.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            apps/runtime/tests/desktop
            apps/runtime/src-tauri/tauri.conf.json
            apps/designer/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      # Node runs the smoke SCRIPT only. CG Bridge runs its own cg-bridge.exe as a service, and the
      # script proves that is the only one: CG Control starts no bridge.
      - name: Set up Node (test harness only)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: CG-*-installer
          path: installers
          merge-multiple: true

      # CENTRAL-BRIDGE-01 — CG Bridge first, per machine, as the Playout's installer chains it: the
      # service CG Control connects to. Its own lifecycle is the bridge-smoke job's.
      - name: Install CG Bridge (elevated)
        shell: pwsh
        run: |
          $bridge = (Get-ChildItem installers -Filter 'CG-Bridge_*-setup.exe').FullName
          $control = (Get-ChildItem installers -Filter 'CG Control_*-setup.exe').FullName
          $designer = (Get-ChildItem installers -Filter 'CG Designer_*-setup.exe').FullName
          node apps/runtime/tests/desktop/installer-smoke.mjs --phase install --bridge "$bridge" --control-installer "$control" --designer-installer "$designer" --version "${{ needs.installers.outputs.version }}" --out smoke

      # WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS in an elevated process (wry#1782),
      # and the runner is elevated — so the apps are installed (each per user, without admin) and
      # driven at medium integrity, as an operator runs them. gsudo is Tauri's own recipe for this
      # (tauri-apps/tauri test-api-e2e.yml); the workspace is opened up so the de-elevated process
      # can write its evidence.
      - name: Install CG Designer and CG Control, launch and drive both apps (unelevated)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          winget install --id gerardog.gsudo --exact --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:Path += ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $gsudo = (Get-Command gsudo -ErrorAction Stop).Source
          # gsudo re-splits an argument at its spaces (run 35862184574: "…\installers\CG" ENOENT),
          # so each installer is handed over under a name without one.
          Copy-Item (Get-ChildItem installers -Filter 'CG Designer_*-setup.exe').FullName installers\cg-designer-setup.exe
          Copy-Item (Get-ChildItem installers -Filter 'CG Control_*-setup.exe').FullName installers\cg-control-setup.exe
          $designer = (Resolve-Path installers\cg-designer-setup.exe).Path
          $control = (Resolve-Path installers\cg-control-setup.exe).Path
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" /T /Q | Out-Null
          & $gsudo --integrity Medium node apps/runtime/tests/desktop/installer-smoke.mjs --phase drive --designer $designer --control $control --version ${{ needs.installers.outputs.version }} --out smoke
          exit $LASTEXITCODE

      - name: Uninstall CG Control (elevated), and sum every phase
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node apps/runtime/tests/desktop/installer-smoke.mjs --phase uninstall --out smoke

      - name: Upload the smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke
          path: smoke/
          retention-days: 14

  # CLIENT-TEST-RELEASE-01 B4 — ON A TAG ONLY, and only once the installers are built from the
  # tagged commit and BOTH clean-Windows smokes have passed (the apps', and CG Bridge's own): a DRAFT
  # pre-release with exactly five files (CENTRAL-BRIDGE-01: CG Bridge's installer joined the two).
  # Never published here.
  release:
    name: Draft release (tag only)
    if: ${{ github.ref_type == 'tag' }}
    needs: [installers, smoke, bridge-smoke]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # For Playwright, which prints the guide with the runner's installed Chrome (nothing fetched).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: CG-*-installer
          path: installers
          merge-multiple: true

      - name: Build the Persian install guide (PDF)
        shell: pwsh
        env:
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          node tools/release/src/build-guide.mjs "docs/release/$env:VERSION/install-guide.fa.md" --out guide/install-guide.pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Exactly five files (tools/release/src/release-files.mjs): the three installers under names with
      # no space (GitHub would rewrite one, and SHA256SUMS.txt would name a file nobody downloads), the
      # guide, and SHA256SUMS.txt over the other four in sha256sum's own format.
      - name: Assemble the release's five files
        shell: pwsh
        env:
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          node tools/release/src/release-files.mjs assemble $env:VERSION installers guide/install-guide.pdf release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Open the DRAFT pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          $notes = @(
            "APASAI CG $env:VERSION - a client test build. DRAFT: published by hand, never by CI.",
            '',
            '- CG Bridge installer - install it FIRST: per machine, the Windows service every CG Control connects to, on the Playout machine or on a server beside it. It opens TCP 5280 and 7911 and UDP 6251-6252 for itself only.',
            '- CG Control installer (per user; no administrator; no bridge of its own - it connects to CG Bridge).',
            '- CG Designer installer (per user; no administrator).',
            '- SHA256SUMS.txt - the SHA-256 of the other four files.',
            '- The Persian install guide (PDF).',
            '',
            'Unsigned test build: Windows SmartScreen warns before installing - the guide says what to press.'
          ) -join "`n"
          $files = (Get-ChildItem release -File).FullName
          gh release create $env:TAG --draft --prerelease --verify-tag --title "APASAI CG $env:VERSION (test build)" --notes $notes @files
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Read back, never trust the exit code (CLAUDE.md "Verify before claiming"): a draft, a
      # pre-release, and exactly these five assets.
      - name: Read the draft back
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          $release = gh release view $env:TAG --json isDraft,isPrerelease,assets,url | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @(node tools/release/src/release-files.mjs expect $env:VERSION | Sort-Object)
          "draft=$($release.isDraft) prerelease=$($release.isPrerelease) url=$($release.url)"
          $release.assets | ForEach-Object { "{0,12}  {1}" -f $_.size, $_.name }
          if (-not $release.isDraft -or -not $release.isPrerelease) { throw 'the release is not a draft pre-release' }
          if (($names -join '|') -ne ($expected -join '|')) { throw "assets are [$($names -join ', ')], not [$($expected -join ', ')]" }

      # P-060 — SHA256SUMS.txt against what was UPLOADED, never the local copy: every line names an asset
      # of the release exactly, every asset but the sums has a line, and each hash is the file's as
      # GitHub serves it (and GitHub's own digest of it, when it reports one). A wrong name stops here.
      - name: Check SHA256SUMS.txt against the uploaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download $env:TAG --dir uploaded
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release view $env:TAG --json assets | Out-File -Encoding utf8 uploaded-assets.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/release/src/release-files.mjs verify uploaded --assets uploaded-assets.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
